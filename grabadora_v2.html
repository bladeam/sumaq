<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estudio de Grabación de Voz Pro</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --primary: #6366f1;
            --danger: #ef4444;
            --success: #10b981;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .studio-card {
            background: var(--card-bg);
            width: 100%;
            max-width: 440px;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.08);
            text-align: center;
        }

        h2 {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 5px;
            color: var(--text-main);
        }

        p.subtitle {
            font-size: 0.85rem;
            color: var(--text-sub);
            margin-bottom: 25px;
        }

        /* --- VISUALIZADOR DE ONDA --- */
        .visualizer-container {
            width: 100%;
            height: 90px;
            background: rgba(15, 23, 42, 0.6);
            border-radius: 12px;
            overflow: hidden;
            margin-bottom: 20px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        canvas {
            width: 100%;
            height: 100%;
        }

        /* --- CRONÓMETRO --- */
        .timer-display {
            font-size: 2.2rem;
            font-weight: 800;
            font-family: monospace;
            color: var(--text-main);
            margin-bottom: 20px;
            letter-spacing: 2px;
        }

        /* --- BOTONES DE CONTROL --- */
        .controls {
            display: flex;
            gap: 12px;
            justify-content: center;
            margin-bottom: 25px;
        }

        .btn {
            border: none;
            padding: 12px 20px;
            border-radius: 10px;
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 8px;
            color: white;
        }

        .btn-record {
            background-color: var(--danger);
            box-shadow: 0 4px 15px rgba(239, 68, 68, 0.3);
        }

        .btn-record:hover {
            background-color: #dc2626;
        }

        .btn-stop {
            background-color: #475569;
        }

        .btn-stop:hover {
            background-color: #334155;
        }

        .btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            box-shadow: none;
        }

        /* Indicador de grabación activo */
        .recording-pulse {
            width: 10px;
            height: 10px;
            background-color: var(--danger);
            border-radius: 50%;
            display: inline-block;
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(0.95); opacity: 1; }
            50% { transform: scale(1.3); opacity: 0.5; }
            100% { transform: scale(0.95); opacity: 1; }
        }

        /* --- REPRODUCTOR & DESCARGA --- */
        .player-section {
            background: rgba(255, 255, 255, 0.03);
            padding: 18px;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        audio {
            width: 100%;
            height: 40px;
            border-radius: 8px;
        }

        .btn-download {
            background-color: var(--success);
            color: white;
            text-decoration: none;
            padding: 12px;
            border-radius: 10px;
            font-weight: 700;
            font-size: 0.95rem;
            transition: background 0.2s;
            box-shadow: 0 4px 15px rgba(16, 185, 129, 0.25);
            display: block;
        }

        .btn-download:hover {
            background-color: #059669;
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

    <div class="studio-card">
        <h2>Grabadora de Voz</h2>
        <p class="subtitle">©Arias Bladimir</p>

        <!-- Visualizador en Vivo -->
        <div class="visualizer-container">
            <canvas id="visualizerCanvas"></canvas>
        </div>

        <!-- Cronómetro -->
        <div class="timer-display" id="timer">00:00</div>

        <!-- Botones de Control -->
        <div class="controls">
            <button id="btnRecord" class="btn btn-record">
                <span id="recordDot"></span> Grabar
            </button>
            <button id="btnStop" class="btn btn-stop" disabled>Detener</button>
           
        </div>

        <!-- Reproductor y Descarga -->
        <div id="playerSection" class="player-section hidden">
            <audio id="audioPreview" controls></audio>
            <a id="downloadBtn" class="btn-download">Descargar Grabación</a>
        </div>
         
    </div>

    <script>
        let mediaRecorder;
        let audioChunks = [];
        let audioContext;
        let analyser;
        let source;
        let animFrameId;
        let timerInterval;
        let secondsElapsed = 0;
        let supportedMimeType = '';

        const btnRecord = document.getElementById('btnRecord');
        const btnStop = document.getElementById('btnStop');
        const recordDot = document.getElementById('recordDot');
        const timerDisplay = document.getElementById('timer');
        const playerSection = document.getElementById('playerSection');
        const audioPreview = document.getElementById('audioPreview');
        const downloadBtn = document.getElementById('downloadBtn');
        const canvas = document.getElementById('visualizerCanvas');
        const canvasCtx = canvas.getContext('2d');

        // Ajustar resolución del canvas
        canvas.width = canvas.offsetWidth;
        canvas.height = canvas.offsetHeight;

        // Detectar formato de audio compatible según el navegador
        function getSupportedMimeType() {
            const types = [
                'audio/webm;codecs=opus',
                'audio/webm',
                'audio/mp4',
                'audio/ogg;codecs=opus',
                'audio/aac'
            ];
            return types.find(type => MediaRecorder.isTypeSupported(type)) || '';
        }

        // Formatear segundos a MM:SS
        function formatTime(seconds) {
            const mins = Math.floor(seconds / 60).toString().padStart(2, '0');
            const secs = (seconds % 60).toString().padStart(2, '0');
            return `${mins}:${secs}`;
        }

        // Dibujar ondas de audio en el Canvas
        function drawVisualizer() {
            const bufferLength = analyser.frequencyBinCount;
            const dataArray = new Uint8Array(bufferLength);

            const draw = () => {
                animFrameId = requestAnimationFrame(draw);
                analyser.getByteFrequencyData(dataArray);

                canvasCtx.fillStyle = '#0f172a';
                canvasCtx.fillRect(0, 0, canvas.width, canvas.height);

                const barWidth = (canvas.width / bufferLength) * 2.5;
                let x = 0;

                for (let i = 0; i < bufferLength; i++) {
                    const barHeight = (dataArray[i] / 255) * canvas.height;

                    // Color de gradiente para barras
                    canvasCtx.fillStyle = `rgb(${barHeight + 99}, 102, 241)`;
                    canvasCtx.fillRect(x, canvas.height - barHeight, barWidth, barHeight);

                    x += barWidth + 1;
                }
            };
            draw();
        }

        // Iniciar Grabación
        btnRecord.addEventListener('click', async () => {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                
                // Configuración de audio y visualizador
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
                analyser = audioContext.createAnalyser();
                source = audioContext.createMediaStreamSource(stream);
                source.connect(analyser);
                analyser.fftSize = 64;

                supportedMimeType = getSupportedMimeType();
                const options = supportedMimeType ? { mimeType: supportedMimeType } : {};
                mediaRecorder = new MediaRecorder(stream, options);

                audioChunks = [];

                mediaRecorder.ondataavailable = (event) => {
                    if (event.data.size > 0) {
                        audioChunks.push(event.data);
                    }
                };

                mediaRecorder.onstop = () => {
                    // Crear Blob con el MIME Type correcto
                    const mime = supportedMimeType || 'audio/webm';
                    const audioBlob = new Blob(audioChunks, { type: mime });
                    const audioUrl = URL.createObjectURL(audioBlob);

                    // Forzar carga limpia del reproductor de audio
                    audioPreview.src = audioUrl;
                    audioPreview.load();

                    // Configurar botón de descarga
                    const extension = mime.includes('mp4') ? 'm4a' : 'webm';
                    downloadBtn.href = audioUrl;
                    downloadBtn.download = `grabacion_${Date.now()}.${extension}`;

                    playerSection.classList.remove('hidden');

                    // Detener el flujo del micrófono
                    stream.getTracks().forEach(track => track.stop());
                };

                mediaRecorder.start();
                drawVisualizer();

                // Cronómetro
                secondsElapsed = 0;
                timerDisplay.textContent = '00:00';
                timerInterval = setInterval(() => {
                    secondsElapsed++;
                    timerDisplay.textContent = formatTime(secondsElapsed);
                }, 1000);

                // UI Status
                recordDot.classList.add('recording-pulse');
                btnRecord.disabled = true;
                btnStop.disabled = false;
                playerSection.classList.add('hidden');

            } catch (err) {
                alert('Ocurrió un error al acceder al micrófono: ' + err.message);
            }
        });

        // Detener Grabación
        btnStop.addEventListener('click', () => {
            if (mediaRecorder && mediaRecorder.state !== 'inactive') {
                mediaRecorder.stop();

                // Detener timer y visualizador
                clearInterval(timerInterval);
                cancelAnimationFrame(animFrameId);
                if (audioContext) audioContext.close();

                // Limpiar visualizador
                canvasCtx.fillStyle = '#0f172a';
                canvasCtx.fillRect(0, 0, canvas.width, canvas.height);

                // UI Status
                recordDot.classList.remove('recording-pulse');
                btnRecord.disabled = false;
                btnStop.disabled = true;
            }
        });
    </script>
   
</body>
</html>
