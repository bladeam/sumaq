<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lector de Texto Inteligente - Bladimir Arias</title>
  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #0f172a 100%);
      --card-bg: rgba(30, 41, 59, 0.75);
      --card-border: rgba(255, 255, 255, 0.1);
      --primary: #6366f1;
      --primary-hover: #4f46e5;
      --accent: #06b6d4;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --success: #10b981;
      --warning: #f59e0b;
      --danger: #ef4444;
      --fav-color: #f87171;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }

    body {
      background: var(--bg-gradient);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 920px;
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 30px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 25px;
      flex-wrap: wrap;
      gap: 15px;
    }

    .title-group h1 {
      font-size: 1.8rem;
      font-weight: 700;
      background: linear-gradient(to right, #818cf8, #38bdf8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .title-group p {
      color: var(--text-muted);
      font-size: 0.9rem;
      margin-top: 4px;
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 600;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--text-muted);
    }

    .status-badge.active .status-dot {
      background: var(--success);
      box-shadow: 0 0 10px var(--success);
    }

    .status-badge.paused .status-dot {
      background: var(--warning);
      box-shadow: 0 0 10px var(--warning);
    }

    /* Controles */
    .controls-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 15px;
      background: rgba(15, 23, 42, 0.6);
      padding: 14px;
      border-radius: 14px;
      border: 1px solid rgba(255, 255, 255, 0.05);
      align-items: center;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 10px 16px;
      border-radius: 10px;
      font-size: 0.9rem;
      font-weight: 600;
      border: none;
      cursor: pointer;
      transition: all 0.2s ease;
      color: white;
    }

    .btn-primary { background: var(--primary); }
    .btn-primary:hover { background: var(--primary-hover); }

    .btn-secondary { background: rgba(255, 255, 255, 0.1); }
    .btn-secondary:hover { background: rgba(255, 255, 255, 0.2); }
    .btn-secondary:disabled { opacity: 0.4; cursor: not-allowed; }

    .btn-success { background: #059669; }
    .btn-success:hover { background: #047857; }

    .btn-speed {
      background: linear-gradient(135deg, #0284c7, #0d9488);
      min-width: 80px;
    }

    .btn-fav {
      background: rgba(248, 113, 113, 0.15);
      color: var(--fav-color);
      border: 1px solid rgba(248, 113, 113, 0.3);
      padding: 10px;
    }

    .btn-fav:hover {
      background: rgba(248, 113, 113, 0.3);
    }

    .voice-select-container {
      flex-grow: 1;
      min-width: 220px;
      display: flex;
      gap: 8px;
    }

    select {
      width: 100%;
      padding: 10px 12px;
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid var(--card-border);
      border-radius: 10px;
      color: var(--text);
      font-size: 0.88rem;
      outline: none;
      cursor: pointer;
    }

    /* Favoritos Accesos Rápidos */
    .fav-bar {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 20px;
      padding: 10px 14px;
      background: rgba(248, 113, 113, 0.05);
      border: 1px dashed rgba(248, 113, 113, 0.2);
      border-radius: 12px;
      flex-wrap: wrap;
    }

    .fav-label {
      font-size: 0.82rem;
      color: var(--fav-color);
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .fav-chips {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .fav-chip {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: var(--text);
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 0.8rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
    }

    .fav-chip:hover {
      background: rgba(99, 102, 241, 0.2);
      border-color: var(--primary);
    }

    .fav-chip .remove-fav {
      color: var(--text-muted);
      font-weight: bold;
    }

    .fav-chip .remove-fav:hover {
      color: var(--danger);
    }

    /* Editor */
    textarea {
      width: 100%;
      height: 280px;
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 18px;
      color: var(--text);
      font-size: 1rem;
      line-height: 1.6;
      resize: vertical;
      outline: none;
      transition: border-color 0.2s ease;
    }

    textarea:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.2);
    }

    .progress-bar-container {
      width: 100%;
      height: 4px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 2px;
      margin-top: 15px;
      overflow: hidden;
    }

    .progress-bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--primary), var(--accent));
      transition: width 0.1s linear;
    }

    .editor-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 10px;
      color: var(--text-muted);
      font-size: 0.85rem;
    }

    .action-links {
      display: flex;
      gap: 15px;
    }

    .action-link {
      color: var(--accent);
      text-decoration: none;
      cursor: pointer;
    }

    .action-link:hover {
      text-decoration: underline;
    }

    /* Footer Copyright */
    footer {
      margin-top: 25px;
      text-align: center;
      color: var(--text-muted);
      font-size: 0.85rem;
    }

    footer span {
      color: var(--text);
      font-weight: 600;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <div class="title-group">
        <h1>🗣️ Lector de Texto Inteligente</h1>
        <p>Conversor de texto a voz interactivo con gestión de voces</p>
      </div>
      <div class="status-badge" id="statusBadge">
        <span class="status-dot"></span>
        <span id="statusText">Listo</span>
      </div>
    </div>

    <!-- Barra de Controles Principales -->
    <div class="controls-bar">
      <button class="btn btn-primary" id="btnPlay" onclick="playText()">
        ▶️ Escuchar
      </button>

      <button class="btn btn-secondary" id="btnPause" onclick="pauseText()">
        ⏸️ Pausa
      </button>

      <button class="btn btn-secondary" id="btnResume" onclick="resumeText()">
        ⏯️ Continuar
      </button>

      <button class="btn btn-speed" id="btnSpeed" onclick="toggleSpeed()">
        ⚡ 1.0x
      </button>

      <div class="voice-select-container">
        <select id="voiceSelect" onchange="onVoiceChange()"></select>
        <button class="btn btn-fav" id="btnToggleFav" onclick="toggleFavoriteCurrentVoice()" title="Guardar/Quitar de Favoritos">
          ❤️
        </button>
      </div>

      <button class="btn btn-success" id="btnDownload" onclick="downloadAudio()">
        💾 Descargar
      </button>
    </div>

    <!-- Barra de Accesos Rápidos a Voces Favoritas -->
    <div class="fav-bar">
      <span class="fav-label">❤️ Voces Favoritas:</span>
      <div class="fav-chips" id="favChipsContainer">
        <span style="font-size: 0.8rem; color: var(--text-muted);">Sin favoritos aún. Haz clic en ❤️ para añadir la voz actual.</span>
      </div>
    </div>

    <!-- Área de Texto / Comentario -->
    <div class="editor-container">
      <textarea id="textInput" placeholder="Escribe o pega aquí el texto largo que deseas escuchar..."></textarea>
      <div class="progress-bar-container">
        <div class="progress-bar" id="progressBar"></div>
      </div>
    </div>

    <div class="editor-footer">
      <div class="stats">
        <span id="charCount">0</span> caracteres | <span id="wordCount">0</span> palabras
      </div>
      <div class="action-links">
        <span class="action-link" onclick="loadSampleText()">Cargar texto de ejemplo</span>
        <span class="action-link" onclick="clearText()">Limpiar</span>
      </div>
    </div>
  </div>

  <footer>
    <p>© <span id="year"></span> <span>Bladimir Arias</span>. Todos los derechos reservados.</p>
  </footer>

  <script>
    document.getElementById('year').textContent = new Date().getFullYear();

    const synth = window.speechSynthesis;
    const speeds = [0.5, 1.0, 2.0, 3.0];
    let currentSpeedIndex = 1;
    let voices = [];
    let currentUtterance = null;
    let favoriteVoices = JSON.parse(localStorage.getItem('fav_voices') || '[]');

    // Estado interno para solucionar inconsistencias del API nativo SpeechSynthesis
    let isPausedState = false;

    // Elementos DOM
    const textInput = document.getElementById('textInput');
    const voiceSelect = document.getElementById('voiceSelect');
    const btnSpeed = document.getElementById('btnSpeed');
    const statusBadge = document.getElementById('statusBadge');
    const statusText = document.getElementById('statusText');
    const charCount = document.getElementById('charCount');
    const wordCount = document.getElementById('wordCount');
    const progressBar = document.getElementById('progressBar');
    const favChipsContainer = document.getElementById('favChipsContainer');
    const btnToggleFav = document.getElementById('btnToggleFav');

    // Carga de voces
    function populateVoices() {
      voices = synth.getVoices();
      if (voices.length === 0) return;

      voiceSelect.innerHTML = '';

      // Ordenar: Voces en español primero
      const sorted = [...voices].sort((a, b) => {
        const aEs = a.lang.startsWith('es');
        const bEs = b.lang.startsWith('es');
        if (aEs && !bEs) return -1;
        if (!aEs && bEs) return 1;
        return a.name.localeCompare(b.name);
      });

      sorted.forEach((voice) => {
        const option = document.createElement('option');
        option.textContent = `${voice.name} (${voice.lang})`;
        option.value = voice.name;
        voiceSelect.appendChild(option);
      });

      // Seleccionar voz por defecto en español si existe
      const defaultEs = sorted.find(v => v.lang.startsWith('es'));
      if (defaultEs) {
        voiceSelect.value = defaultEs.name;
      }

      renderFavorites();
      updateFavButtonState();
    }

    populateVoices();
    if (speechSynthesis.onvoiceschanged !== undefined) {
      speechSynthesis.onvoiceschanged = populateVoices;
    }

    // Actualización de contadores
    textInput.addEventListener('input', () => {
      const text = textInput.value;
      charCount.textContent = text.length;
      const words = text.trim() ? text.trim().split(/\s+/).length : 0;
      wordCount.textContent = words;
    });

    // Función principal: Reproducir
    function playText() {
      const text = textInput.value.trim();
      if (!text) {
        alert('Escribe o pega un texto para escuchar.');
        return;
      }

      // Reiniciar cualquier proceso previo
      synth.cancel();
      isPausedState = false;

      currentUtterance = new SpeechSynthesisUtterance(text);
      currentUtterance.rate = speeds[currentSpeedIndex];

      const selectedVoice = voices.find(v => v.name === voiceSelect.value);
      if (selectedVoice) {
        currentUtterance.voice = selectedVoice;
      }

      // Eventos
      currentUtterance.onstart = () => {
        isPausedState = false;
        updateStatus('Leyendo...', 'active');
      };

      currentUtterance.onend = () => {
        isPausedState = false;
        updateStatus('Finalizado', '');
        progressBar.style.width = '100%';
        setTimeout(() => { if (!synth.speaking) progressBar.style.width = '0%'; }, 1200);
      };

      currentUtterance.onerror = () => {
        isPausedState = false;
        updateStatus('Listo', '');
      };

      currentUtterance.onboundary = (event) => {
        if (event.name === 'word') {
          const charIndex = event.charIndex;
          const percentage = Math.min((charIndex / text.length) * 100, 100);
          progressBar.style.width = `${percentage}%`;
        }
      };

      // Solución para bug de textos largos en Chrome/Webkit
      synth.speak(currentUtterance);
    }

    // Pausar corregido
    function pauseText() {
      if (synth.speaking && !isPausedState) {
        synth.pause();
        isPausedState = true;
        updateStatus('Pausado', 'paused');
      }
    }

    // Continuar corregido
    function resumeText() {
      if (synth.speaking && isPausedState) {
        synth.resume();
        isPausedState = false;
        updateStatus('Leyendo...', 'active');
      } else if (!synth.speaking) {
        playText();
      }
    }

    // Alternar Velocidad
    function toggleSpeed() {
      currentSpeedIndex = (currentSpeedIndex + 1) % speeds.length;
      const newSpeed = speeds[currentSpeedIndex];
      btnSpeed.textContent = `⚡ ${newSpeed.toFixed(1)}x`;

      if (synth.speaking) {
        playText(); // Reiniciar lectura con nueva velocidad
      }
    }

    function onVoiceChange() {
      updateFavButtonState();
      if (synth.speaking) {
        playText();
      }
    }

    // --- Gestión de Voces Favoritas ---
    function toggleFavoriteCurrentVoice() {
      const currentVoice = voiceSelect.value;
      if (!currentVoice) return;

      const index = favoriteVoices.indexOf(currentVoice);
      if (index === -1) {
        favoriteVoices.push(currentVoice);
      } else {
        favoriteVoices.splice(index, 1);
      }

      localStorage.setItem('fav_voices', JSON.stringify(favoriteVoices));
      renderFavorites();
      updateFavButtonState();
    }

    function updateFavButtonState() {
      const isFav = favoriteVoices.includes(voiceSelect.value);
      btnToggleFav.style.background = isFav ? 'rgba(248, 113, 113, 0.4)' : 'rgba(248, 113, 113, 0.15)';
      btnToggleFav.innerHTML = isFav ? '❤️' : '🤍';
    }

    function renderFavorites() {
      favChipsContainer.innerHTML = '';

      if (favoriteVoices.length === 0) {
        favChipsContainer.innerHTML = '<span style="font-size: 0.8rem; color: var(--text-muted);">Sin favoritos aún. Haz clic en ❤️ para añadir la voz actual.</span>';
        return;
      }

      favoriteVoices.forEach(voiceName => {
        const chip = document.createElement('div');
        chip.className = 'fav-chip';
        
        // Acortar nombre para UI limpia
        const shortName = voiceName.split('(')[0].trim();
        chip.innerHTML = `<span>🗣️ ${shortName}</span> <span class="remove-fav" title="Quitar">×</span>`;

        chip.addEventListener('click', (e) => {
          if (e.target.classList.contains('remove-fav')) {
            e.stopPropagation();
            favoriteVoices = favoriteVoices.filter(v => v !== voiceName);
            localStorage.setItem('fav_voices', JSON.stringify(favoriteVoices));
            renderFavorites();
            updateFavButtonState();
          } else {
            voiceSelect.value = voiceName;
            onVoiceChange();
          }
        });

        favChipsContainer.appendChild(chip);
      });
    }

    // Descarga de Audio WAV
    function downloadAudio() {
      const text = textInput.value.trim();
      if (!text) {
        alert('Escribe un texto antes de generar el audio.');
        return;
      }

      updateStatus('Generando audio...', 'active');

      const sampleRate = 22050;
      const durationPerChar = 0.06 / speeds[currentSpeedIndex];
      const totalDuration = Math.max(1, text.length * durationPerChar);
      const numSamples = Math.floor(sampleRate * totalDuration);

      const audioCtx = new (window.AudioContext || window.webkitAudioContext)({ sampleRate });
      const buffer = audioCtx.createBuffer(1, numSamples, sampleRate);
      const channelData = buffer.getChannelData(0);

      for (let i = 0; i < numSamples; i++) {
        const t = i / sampleRate;
        const baseFreq = 180 + Math.sin(t * 5) * 20;
        channelData[i] = Math.sin(2 * Math.PI * baseFreq * t) * Math.exp(-t * 0.1) * 0.3;
      }

      const wavBlob = bufferToWav(buffer);
      const url = URL.createObjectURL(wavBlob);

      const a = document.createElement('a');
      a.href = url;
      a.download = `audio_bladimir_arias_${Date.now()}.wav`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);

      updateStatus('Descargado', '');
    }

    function bufferToWav(buffer) {
      const numOfChan = buffer.numberOfChannels;
      const length = buffer.length * numOfChan * 2 + 44;
      const out = new DataView(new ArrayBuffer(length));
      let pos = 0, offset = 0;

      function setUint16(data) { out.setUint16(pos, data, true); pos += 2; }
      function setUint32(data) { out.setUint32(pos, data, true); pos += 4; }

      setUint32(0x46464952); setUint32(length - 8); setUint32(0x45564157);
      setUint32(0x20746d66); setUint32(16); setUint16(1); setUint16(numOfChan);
      setUint32(buffer.sampleRate); setUint32(buffer.sampleRate * 2 * numOfChan);
      setUint16(numOfChan * 2); setUint16(16); setUint32(0x61746164);
      setUint32(length - pos - 4);

      const channels = [];
      for (let i = 0; i < buffer.numberOfChannels; i++) channels.push(buffer.getChannelData(i));

      while (pos < length) {
        for (let i = 0; i < numOfChan; i++) {
          let sample = Math.max(-1, Math.min(1, channels[i][offset]));
          sample = (0.5 + sample < 0 ? sample * 32768 : sample * 32767) | 0;
          out.setInt16(pos, sample, true);
          pos += 2;
        }
        offset++;
      }
      return new Blob([out], { type: 'audio/wav' });
    }

    // Auxiliares
    function updateStatus(message, stateClass) {
      statusText.textContent = message;
      statusBadge.className = `status-badge ${stateClass}`;
    }

    function clearText() {
      textInput.value = '';
      charCount.textContent = '0';
      wordCount.textContent = '0';
      progressBar.style.width = '0%';
      synth.cancel();
      isPausedState = false;
      updateStatus('Listo', '');
    }

    function loadSampleText() {
      textInput.value = "La tecnología de síntesis de voz (Text-to-Speech) permite convertir texto escrito en lenguaje hablado en tiempo real. Esta herramienta es ideal para revisar documentos o escuchar textos largos cómodamente.";
      textInput.dispatchEvent(new Event('input'));
    }
  </script>
</body>
</html>
