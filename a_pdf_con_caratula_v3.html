<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generador de Carátula y Convertidor a PDF - ULAT</title>
    
    <!-- Librerías requeridas: html2canvas y jsPDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    
    <style>
        :root {
            --primary-color: #0b2545;
            --accent-color: #134074;
            --bg-color: #eef4f8;
            --panel-bg: #ffffff;
            --text-color: #1d2d44;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            gap: 30px;
            padding: 25px;
            min-height: 100vh;
        }

        /* --- PANEL DE CONTROL (IZQUIERDA) --- */
        .controls-panel {
            background: var(--panel-bg);
            width: 380px;
            flex-shrink: 0;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
            height: calc(100vh - 50px);
            position: sticky;
            top: 25px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
        }

        .controls-panel h2 {
            font-size: 1.2rem;
            color: var(--primary-color);
            margin-bottom: 15px;
            margin-top: 15px;
            border-bottom: 2px solid var(--accent-color);
            padding-bottom: 6px;
        }

        .controls-panel h2:first-of-type {
            margin-top: 0;
        }

        .form-group {
            margin-bottom: 12px;
            display: flex;
            flex-direction: column;
        }

        .form-group label {
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 5px;
            color: #4a5568;
        }

        .form-group input[type="text"], 
        .form-group textarea, 
        .form-group select {
            padding: 9px 12px;
            border: 1px solid #cbd5e0;
            border-radius: 6px;
            font-size: 0.9rem;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .form-group input:focus, 
        .form-group textarea:focus, 
        .form-group select:focus {
            border-color: var(--accent-color);
            box-shadow: 0 0 0 3px rgba(19, 64, 116, 0.15);
        }

        .btn-select-img {
            background-color: var(--accent-color);
            color: white;
            text-align: center;
            padding: 10px;
            border-radius: 6px;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            transition: background 0.2s;
            display: block;
        }

        .btn-select-img:hover {
            background-color: var(--primary-color);
        }

        input[type="file"] {
            display: none;
        }

        .thumbs-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-height: 180px;
            overflow-y: auto;
            border: 1px solid #cbd5e0;
            padding: 8px;
            border-radius: 6px;
            background: #f8fafc;
            margin-top: 8px;
        }

        .thumb-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: white;
            padding: 5px 8px;
            border-radius: 4px;
            border: 1px solid #e2e8f0;
        }

        .thumb-item img {
            width: 40px;
            height: 40px;
            object-fit: cover;
            border-radius: 4px;
        }

        .thumb-actions {
            display: flex;
            gap: 4px;
        }

        .btn-action {
            background: #e2e8f0;
            border: none;
            color: #2d3748;
            padding: 4px 8px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.8rem;
            font-weight: bold;
        }

        .btn-action:hover {
            background: #cbd5e0;
        }

        .btn-danger {
            background: #e53e3e;
            color: white;
        }

        .btn-danger:hover {
            background: #c53030;
        }

        .empty-thumbs {
            font-size: 0.8rem;
            color: #a0aec0;
            text-align: center;
            padding: 10px 0;
        }

        .btn-pdf {
            background-color: #2b6cb0;
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 15px;
            transition: background 0.2s, transform 0.1s;
            box-shadow: 0 4px 12px rgba(43, 108, 176, 0.3);
            width: 100%;
        }

        .btn-pdf:hover {
            background-color: #2c5282;
        }

        .btn-pdf:active {
            transform: scale(0.98);
        }

        /* --- VISTA PREVIA (DERECHA) --- */
        .preview-container {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 25px;
            overflow-x: auto;
        }

        /* Hoja Carta (215.9mm x 279mm) */
        .page-letter {
            width: 215.9mm;
            height: 279mm;
            background: white;
            padding: 20mm 22mm 18mm 22mm;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-sizing: border-box;
            overflow: hidden;
        }

        /* Encabezado */
        .header-section {
            display: flex;
            align-items: center;
            gap: 20px;
            border-bottom: 2.5px solid var(--primary-color);
            padding-bottom: 18px;
            flex-shrink: 0;
        }

        .logo-container {
            width: 135px;
            height: 135px;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 5px;
        }

        .logo-container img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        .header-text {
            flex-grow: 1;
            text-align: left;
        }

        .header-text h1 {
            font-size: 1.45rem;
            text-transform: uppercase;
            color: var(--primary-color);
            font-weight: 800;
            line-height: 1.2;
            margin-bottom: 6px;
        }

        .header-text h2 {
            font-size: 1.1rem;
            font-weight: 600;
            color: #4a5568;
            margin-bottom: 4px;
        }

        .header-text h3 {
            font-size: 1.05rem;
            font-weight: 600;
            color: #2b6cb0;
        }

        /* Título Central */
        .title-section {
            text-align: center;
            margin: auto 0;
            padding: 20px 10px;
        }

        .doc-title {
            font-size: 2.3rem;
            font-weight: 800;
            color: var(--primary-color);
            text-transform: uppercase;
            letter-spacing: 1px;
            line-height: 1.3;
            word-wrap: break-word;
        }

        /* Sección Datos */
        .info-section {
            margin-bottom: 30px;
            padding-left: 30px;
            flex-shrink: 0;
        }

        .info-table {
            width: 100%;
            border-collapse: collapse;
        }

        .info-table td {
            padding: 8px 0;
            vertical-align: top;
            font-size: 1.05rem;
            line-height: 1.4;
        }

        .info-table td.label {
            font-weight: 700;
            width: 32%;
            color: var(--primary-color);
        }

        .info-table td.value {
            color: #2d3748;
        }

        /* Pie de Página */
        .footer-section {
            text-align: center;
            border-top: 1.5px solid #cbd5e0;
            padding-top: 12px;
            font-size: 1rem;
            font-weight: 700;
            color: #4a5568;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            flex-shrink: 0;
        }

        .image-page {
            justify-content: center;
            align-items: center;
            padding: 10mm;
        }

        .image-page img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        @media (max-width: 1024px) {
            body {
                flex-direction: column;
                align-items: center;
            }
            .controls-panel {
                width: 100%;
                max-width: 215.9mm;
                height: auto;
                position: static;
            }
        }
    </style>
</head>
<body>

    <!-- PANEL DE CONTROL (IZQUIERDA) -->
    <div class="controls-panel">
        <h2>Configurar Carátula</h2>

        <div class="form-group">
            <label for="inputUni">Universidad:</label>
            <input type="text" id="inputUni" value="Universidad Latinoamericana" oninput="updatePreview()">
        </div>

        <div class="form-group">
            <label for="inputFacultad">Facultad:</label>
            <input type="text" id="inputFacultad" value="Facultad de Ciencias y Tecnología" oninput="updatePreview()">
        </div>

        <div class="form-group">
            <label for="inputCarrera">Carrera:</label>
            <input type="text" id="inputCarrera" value="Ingeniería de Sistemas" oninput="updatePreview()">
        </div>

        <div class="form-group">
            <label for="inputTitulo">Título del Trabajo:</label>
            <input type="text" id="inputTitulo" value="Trabajo Práctico 1" oninput="updatePreview()">
        </div>

        <div class="form-group">
            <label for="inputMateria">Materia:</label>
            <input type="text" id="inputMateria" value="Bade de datos I" oninput="updatePreview()">
        </div>

        <div class="form-group">
            <label for="inputDocente">Docente:</label>
            <input type="text" id="inputDocente" value="Ing." oninput="updatePreview()">
        </div>

        <div class="form-group">
            <label for="selectTipoEstudiante">Modalidad de Presentación:</label>
            <select id="selectTipoEstudiante" onchange="toggleStudentMode()">
                <option value="individual">Estudiante (Individual)</option>
                <option value="grupal">Integrantes del Grupo (Grupal)</option>
            </select>
        </div>

        <div class="form-group">
            <label id="labelEstudiantes" for="inputEstudiantes">Estudiante(s):</label>
            <textarea id="inputEstudiantes" rows="3" oninput="updatePreview()">Juan Perez</textarea>
        </div>

        <div class="form-group">
            <label for="inputFecha">Fecha:</label>
            <input type="text" id="inputFecha" value="22 de julio de 2026" oninput="updatePreview()">
        </div>

        <h2>Añadir Imágenes</h2>
        <div class="form-group">
            <label for="imageInput" class="btn-select-img">Cargar Imágenes</label>
            <input type="file" id="imageInput" accept="image/*" multiple onchange="handleImageUpload(event)" />
            
            <div class="thumbs-list" id="thumbsList">
                <p class="empty-thumbs">Sin imágenes adjuntas</p>
            </div>
        </div>

        <button class="btn-pdf" id="btnDownload" onclick="downloadPDF()">Descargar PDF Completo</button>
        <br>
        <p style="text-align: center; font-size: 0.85rem; color: #718096;">© Arias Bladimir</p>
    </div>

    <!-- VISTA PREVIA (DERECHA - HOJAS CARTA) -->
    <div class="preview-container">
        
        <!-- PÁGINA 1: CARÁTULA -->
        <div class="page-letter" id="coverPage">
            <!-- Encabezado con Imagen de Logo -->
            <div class="header-section">
                <div class="logo-container">
                    <img id="logoImg" src="logo.jpg" alt="Logo Universidad" onerror="this.style.display='none'">
                </div>
                <div class="header-text">
                    <h1 id="viewUni">Universidad Latinoamericana</h1>
                    <h2 id="viewFacultad">Facultad de Ciencias y Tecnología</h2>
                    <h3 id="viewCarrera">Ingeniería de Sistemas</h3>
                </div>
            </div>

            <!-- Título del Trabajo -->
            <div class="title-section">
                <div class="doc-title" id="viewTitulo">Trabajo Práctico 1</div>
            </div>

            <!-- Datos Generales -->
            <div class="info-section">
                <table class="info-table">
                    <tr>
                        <td class="label">Materia:</td>
                        <td class="value" id="viewMateria">Bade de datos I</td>
                    </tr>
                    <tr>
                        <td class="label">Docente:</td>
                        <td class="value" id="viewDocente">Ing.</td>
                    </tr>
                    <tr>
                        <td class="label" id="viewStudentLabel">Estudiante:</td>
                        <td class="value" id="viewEstudiantes">Juan Perez</td>
                    </tr>
                    <tr>
                        <td class="label">Fecha:</td>
                        <td class="value" id="viewFecha">22 de julio de 2026</td>
                    </tr>
                </table>
            </div>

            <!-- Pie de Página -->
            <div class="footer-section">
                Cochabamba - Bolivia
            </div>
        </div>

        <div id="imagePagesContainer"></div>

    </div>

    <!-- JAVASCRIPT -->
    <script>
        let imageList = [];

        function updatePreview() {
            document.getElementById('viewUni').innerText = document.getElementById('inputUni').value || 'Universidad Latinoamericana';
            document.getElementById('viewFacultad').innerText = document.getElementById('inputFacultad').value || 'Facultad de Ciencias y Tecnología';
            document.getElementById('viewCarrera').innerText = document.getElementById('inputCarrera').value || 'Ingeniería de Sistemas';
            document.getElementById('viewTitulo').innerText = document.getElementById('inputTitulo').value || 'Trabajo Práctico 1';
            document.getElementById('viewMateria').innerText = document.getElementById('inputMateria').value || 'Bade de datos I';
            document.getElementById('viewDocente').innerText = document.getElementById('inputDocente').value || 'Ing.';
            
            const estudiantesText = document.getElementById('inputEstudiantes').value;
            document.getElementById('viewEstudiantes').innerHTML = estudiantesText.replace(/\n/g, '<br>');
            
            document.getElementById('viewFecha').innerText = document.getElementById('inputFecha').value || '22 de julio de 2026';
        }

        function toggleStudentMode() {
            const mode = document.getElementById('selectTipoEstudiante').value;
            const labelForm = document.getElementById('labelEstudiantes');
            const viewLabel = document.getElementById('viewStudentLabel');

            if (mode === 'grupal') {
                labelForm.innerText = 'Integrantes del Grupo:';
                viewLabel.innerText = 'Integrantes del Grupo:';
            } else {
                labelForm.innerText = 'Estudiante:';
                viewLabel.innerText = 'Estudiante:';
            }
        }

        /* --- MANEJO DE IMÁGENES --- */
        function handleImageUpload(event) {
            const files = Array.from(event.target.files);
            if (files.length === 0) return;

            let loadedCount = 0;
            files.forEach(file => {
                const reader = new FileReader();
                reader.onload = (e) => {
                    imageList.push({
                        dataUrl: e.target.result,
                        type: file.type === 'image/png' ? 'PNG' : 'JPEG'
                    });
                    loadedCount++;
                    if (loadedCount === files.length) {
                        renderImages();
                    }
                };
                reader.readAsDataURL(file);
            });
            event.target.value = '';
        }

        function moveImage(index, direction) {
            const newIndex = index + direction;
            if (newIndex < 0 || newIndex >= imageList.length) return;
            
            const temp = imageList[index];
            imageList[index] = imageList[newIndex];
            imageList[newIndex] = temp;
            
            renderImages();
        }

        function removeImage(index) {
            imageList.splice(index, 1);
            renderImages();
        }

        function renderImages() {
            const thumbsList = document.getElementById('thumbsList');
            const pagesContainer = document.getElementById('imagePagesContainer');

            thumbsList.innerHTML = '';
            pagesContainer.innerHTML = '';

            if (imageList.length === 0) {
                thumbsList.innerHTML = '<p class="empty-thumbs">Sin imágenes adjuntas</p>';
                return;
            }

            imageList.forEach((imgObj, index) => {
                const thumbItem = document.createElement('div');
                thumbItem.className = 'thumb-item';
                thumbItem.innerHTML = `
                    <img src="${imgObj.dataUrl}" alt="Img ${index + 1}">
                    <div class="thumb-actions">
                        <button class="btn-action" onclick="moveImage(${index}, -1)" ${index === 0 ? 'disabled' : ''}>▲</button>
                        <button class="btn-action" onclick="moveImage(${index}, 1)" ${index === imageList.length - 1 ? 'disabled' : ''}>▼</button>
                        <button class="btn-action btn-danger" onclick="removeImage(${index})">✕</button>
                    </div>
                `;
                thumbsList.appendChild(thumbItem);

                const pageDiv = document.createElement('div');
                pageDiv.className = 'page-letter image-page';
                pageDiv.style.marginTop = '25px';
                pageDiv.innerHTML = `<img src="${imgObj.dataUrl}" alt="Imagen ${index + 1}">`;
                pagesContainer.appendChild(pageDiv);
            });
        }

        /* --- GENERACIÓN DE PDF GARANTIZADA --- */
        async function downloadPDF() {
            const btn = document.getElementById('btnDownload');
            btn.disabled = true;
            btn.innerText = 'Generando PDF...';

            try {
                const { jsPDF } = window.jspdf;
                const pdf = new jsPDF('p', 'mm', 'letter');
                const pageWidth = pdf.internal.pageSize.getWidth();
                const pageHeight = pdf.internal.pageSize.getHeight();

                // 1. CAPTURAR Y GENERAR CARÁTULA
                const coverElement = document.getElementById('coverPage');
                
                // Configuración a prueba de errores para html2canvas
                const canvas = await html2canvas(coverElement, {
                    scale: 2,
                    useCORS: true,
                    allowTaint: true,
                    logging: false,
                    windowWidth: document.body.scrollWidth,
                    windowHeight: document.body.scrollHeight
                });

                const coverImgData = canvas.toDataURL('image/jpeg', 0.95);
                pdf.addImage(coverImgData, 'JPEG', 0, 0, pageWidth, pageHeight);

                // 2. AÑADIR CADA IMAGEN EN UNA PÁGINA INDEPENDIENTE
                for (let i = 0; i < imageList.length; i++) {
                    pdf.addPage();

                    const imgObj = imageList[i];
                    const dimensions = await getImageDimensions(imgObj.dataUrl);

                    const margin = 10;
                    const maxW = pageWidth - (margin * 2);
                    const maxH = pageHeight - (margin * 2);

                    const ratio = Math.min(maxW / dimensions.width, maxH / dimensions.height);
                    const imgW = dimensions.width * ratio;
                    const imgH = dimensions.height * ratio;

                    const xPos = (pageWidth - imgW) / 2;
                    const yPos = (pageHeight - imgH) / 2;

                    pdf.addImage(imgObj.dataUrl, imgObj.type, xPos, yPos, imgW, imgH);
                }

                pdf.save('trabajo_academico.pdf');

            } catch (error) {
                console.error("Error crítico en descarga:", error);
                alert("Hubo un detalle al exportar. Asegúrate de abrir el archivo directamente en un navegador como Chrome o Edge.");
            } finally {
                btn.disabled = false;
                btn.innerText = 'Descargar PDF Completo';
            }
        }

        function getImageDimensions(dataUrl) {
            return new Promise((resolve) => {
                const img = new Image();
                img.onload = () => resolve({ width: img.width, height: img.height });
                img.onerror = () => resolve({ width: 800, height: 600 });
                img.src = dataUrl;
            });
        }

        toggleStudentMode();
    </script>
</body>
</html>
