    <meta charset="UTF-8">

    <title>Juego de Conteo en Quechua</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background-color: #f0f8ff;
            color: #333;
            text-align: center;
        }

        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            padding: 20px;
            background-color: #fff;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            width: 90%;
            max-width: 600px;
        }

        .image-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            width: 100%;
            min-height: 200px;
            border: 2px solid #ccc;
            border-radius: 8px;
            padding: 10px;
            background-color: #e6f7ff;
            gap: 10px;
        }

        .image-container span {
            font-size: 30px;
        }

        .question {
            font-size: 3em;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .options-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: 100%;
        }

        .option {
            background-color: #007bff;
            color: #fff;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1em;
            transition: background-color 0.3s ease;
        }

        .option:hover:not(:disabled) {
            background-color: #0056b3;
        }

        .feedback {
            margin-top: 20px;
            font-size: 1.2em;
            font-weight: bold;
        }

        .correct {
            color: green;
        }

        .incorrect {
            color: red;
        }

        #end-game-btn {
            margin-top: 20px;
            background-color: #dc3545;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1em;
        }

        #end-game-btn:hover {
            background-color: #c82333;
        }

        .history-container {
            margin-top: 30px;
            padding: 20px;
            background-color: #f8f9fa;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
            width: 90%;
            max-width: 600px;
        }

        .history-item {
            padding: 8px;
            border-bottom: 1px solid #e9ecef;
            text-align: left;
        }

        .history-item:last-child {
            border-bottom: none;
        }
    </style>
</head>

        const imageContainer = document.getElementById('image-container');
        const optionsContainer = document.getElementById('options-container');
        const feedbackMessage = document.getElementById('feedback-message');
        const endGameBtn = document.getElementById('end-game-btn');

        let currentQuestion;
        let history = [];

        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
        }

        function generateQuestion() {
            imageContainer.innerHTML = '';
            optionsContainer.innerHTML = '';
            feedbackMessage.textContent = '';
            
            endGameBtn.disabled = false;

            currentQuestion = database[Math.floor(Math.random() * database.length)];

            for (let i = 0; i < currentQuestion.count; i++) {
                const span = document.createElement('span');
                span.textContent = currentQuestion.image;
                imageContainer.appendChild(span);
            }

            let options = new Set();
            options.add(currentQuestion.name);

            const incorrectItems = database.filter(item => item.name !== currentQuestion.name);
            shuffleArray(incorrectItems);

            for (let i = 0; options.size < 4 && i < incorrectItems.length; i++) {
                options.add(incorrectItems[i].name);
            }
            
            let shuffledOptions = Array.from(options);
            shuffleArray(shuffledOptions);

            shuffledOptions.forEach(option => {
                const button = document.createElement('button');
                button.textContent = option;
                button.classList.add('option');
                button.addEventListener('click', () => checkAnswer(option));
                optionsContainer.appendChild(button);
            });
        }

        function checkAnswer(selectedOption) {
            let isCorrect = (selectedOption === currentQuestion.name);
            history.push({
                question: `${currentQuestion.count} ${currentQuestion.image}`,
                answer: selectedOption,
                correct: isCorrect
            });

            if (isCorrect) {
                feedbackMessage.textContent = '¡Correcto!';
                feedbackMessage.classList.add('correct');
                feedbackMessage.classList.remove('incorrect');
            } else {
                feedbackMessage.textContent = `Incorrecto. La respuesta correcta era: ${currentQuestion.name}`;
                feedbackMessage.classList.add('incorrect');
                feedbackMessage.classList.remove('correct');
            }

            document.querySelectorAll('.option').forEach(button => {
                button.disabled = true;
            });
            
            setTimeout(generateQuestion, 2000);
        }

        function endGame() {
            const container = document.querySelector('.container');
            container.innerHTML = '';
            
            const historyContainer = document.createElement('div');
            historyContainer.classList.add('history-container');
            
            const title = document.createElement('h2');
            title.textContent = 'Historial de Respuestas';
            historyContainer.appendChild(title);
            
            history.forEach((item, index) => {
                const historyItem = document.createElement('div');
                historyItem.classList.add('history-item');
                let status = item.correct ? 'Correcto' : 'Incorrecto';
                let statusColor = item.correct ? 'green' : 'red';
                historyItem.innerHTML = `
                    <strong>Pregunta ${index + 1}:</strong> ${item.question} <br>
                    <strong>Tu respuesta:</strong> ${item.answer} <br>
                    <strong>Estado:</strong> <span style="color:${statusColor};">${status}</span>
                `;
                historyContainer.appendChild(historyItem);
            });
            
            container.appendChild(historyContainer);
        }

        endGameBtn.addEventListener('click', endGame);

        document.addEventListener('DOMContentLoaded', generateQuestion);
    </script>

</body>
</html>
