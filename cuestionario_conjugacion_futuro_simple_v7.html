    <meta charset="UTF-8">

    <title>Cuestionario Quechua - Msc. Bladimir Arias Mejia</title>
    <style>
        :root {
            --primary: #2c3e50;
            --accent: #3498db;
            --success: #27ae60;
            --error: #e74c3c;
            --light: #b1f8e0;
            --noun-color: #2624b7; /* Azul para el sustantivo */
            --pos-color: #e74c3c;  /* Rojo para el sufijo */
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--light);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            margin: 0;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            width: 90%;
            max-width: 850px;
            text-align: center;
        }
        h1 { color: var(--primary); margin-bottom: 5px; }
        .author-tag { font-size: 0.9em; color: #7f8c8d; margin-bottom: 20px; }
        
        textarea, input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: 2px solid #ddd;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 16px;
        }
        button {
            background: var(--accent);
            color: rgb(189, 75, 75);
            border: none;
            padding: 12px 25px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            transition: 0.3s;
        }
        button:hover { background: #2980b9; transform: translateY(-1px); }

        .hidden { display: none; }
        
        .player-turn { font-size: 1.4em; font-weight: bold; color: var(--accent); margin-bottom: 10px; }
        .question-box { font-size: 1.6em; margin: 25px 0; padding: 20px; background: #fdfdfd; border: 1px dashed #ccc; border-radius: 10px; }
        
        .options-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
            margin-bottom: 20px;
        }
        .option-btn {
            background: #fff;
            border: 2px solid #eee;
            padding: 15px;
            border-radius: 10px;
            text-align: left;
            cursor: pointer;
            font-size: 1.3em;
            transition: 0.2s;
        }
        .option-btn:hover { border-color: var(--accent); background: #f7fbff; }
        
        /* Colores específicos solicitados */
        .sustantivo { color: var(--noun-color); font-weight: bold; }
        .sufijo { color: var(--pos-color); font-weight: bold; }

        #feedback { font-size: 1.8em; font-weight: bold; margin: 15px 0; min-height: 60px; }
        .allin { color: var(--success); }
        .mana-allin { color: var(--error); }

        table { width: 100%; border-collapse: collapse; margin-top: 20px; background: white; }
        th, td { border: 1px solid #ddd; padding: 12px; text-align: left; }
        th { background: var(--primary); color: white; }
        
        footer { margin-top: 50px; font-size: 0.9em; color: #3117a6; border-top: 1px solid #ccc; padding-top: 10px; width: 100%; text-align: center; }
    </style>
</head>

        <div id="feedback"></div>

        let state = {
            players: [],
            questionsPerPlayer: 0,
            currentRound: 0,
            totalRounds: 0,
            db: [],
            history: [],
            scores: {},
            active: false
        };

        function parseDB() {
            return RAW_DATABASE.trim().split('\n').map(line => {
                const [esp, que] = line.split('=').map(s => s.trim());
                return { esp, que };
            });
        }

        // Algoritmo Fisher-Yates para barajado robusto
        function shuffle(array) {
            let m = array.length, t, i;
            while (m) {
                i = Math.floor(Math.random() * m--);
                t = array[m];
                array[m] = array[i];
                array[i] = t;
            }
            return array;
        }

        // Formatea la palabra para mostrar sustantivo en naranja y sufijo en rojo
        function formatQuechuaHTML(word) {
            for (let s of SUFFIXES) {
                if (word.endsWith(s)) {
                    const root = word.substring(0, word.lastIndexOf(s));
                    return `<span class="sustantivo">${root}</span><span class="sufijo">${s}</span>`;
                }
            }
            return `<span class="sustantivo">${word}</span>`;
        }

        function generateOptions(correct) {
            let root = "";
            for (let s of SUFFIXES) {
                if (correct.endsWith(s)) {
                    root = correct.substring(0, correct.lastIndexOf(s));
                    break;
                }
            }
            if(!root) root = correct;

            let opts = new Set([correct]);
            while(opts.size < 5) {
                let randomS = SUFFIXES[Math.floor(Math.random() * SUFFIXES.length)];
                opts.add(root + randomS);
            }
            return shuffle(Array.from(opts));
        }

        function initGame() {
            const list = document.getElementById('participants-list').value.trim();
            if(!list) return alert("Por favor, ingrese nombres de participantes.");
            
            state.players = list.split('\n').map(n => n.trim()).filter(n => n);
            state.questionsPerPlayer = parseInt(document.getElementById('rounds-count').value);
            state.db = parseDB();
            state.totalRounds = state.players.length * state.questionsPerPlayer;
            state.players.forEach(p => state.scores[p] = 0);
            
            document.getElementById('setup-screen').classList.add('hidden');
            document.getElementById('game-screen').classList.remove('hidden');
            renderRound();
        }

        function renderRound() {
            if(state.currentRound >= state.totalRounds) return showResults();

            state.active = true;
            const player = state.players[state.currentRound % state.players.length];
            const item = state.db[Math.floor(Math.random() * state.db.length)];
            
            document.getElementById('player-turn-display').innerText = `Turno de: ${player}`;
            document.getElementById('progress-display').innerText = `Pregunta ${state.currentRound + 1} de ${state.totalRounds}`;
            document.getElementById('question-label').innerText = `¿Cómo se dice "${item.esp}"?`;
            document.getElementById('feedback').innerText = "";

            const options = generateOptions(item.que);
            const container = document.getElementById('options-container');
            container.innerHTML = "";
            
            const letters = ['a', 'b', 'c', 'd', 'e'];
            options.forEach((opt, i) => {
                const btn = document.createElement('button');
                btn.className = "option-btn";
                btn.innerHTML = `<strong>${letters[i]})</strong> ${formatQuechuaHTML(opt)}`;
                btn.onclick = () => processAnswer(opt, item.que, player, item.esp);
                container.appendChild(btn);
            });
        }

        function processAnswer(selected, correct, player, esp) {
            if(!state.active) return;
            state.active = false;

            const feed = document.getElementById('feedback');
            const isOk = (selected === correct);
            let delay = 1000;

            if(isOk) {
                feed.innerHTML = '<span class="allin">ALLIN</span>';
                state.scores[player]++;
            } else {
                feed.innerHTML = `<span class="mana-allin">MANA ALLINCHU</span><br><small style="color:#333">La respuesta correcta era: ${correct}</small>`;
                delay = 2000;
            }

            state.history.push({ player, esp, selected, status: isOk ? '✅' : '❌' });
            state.currentRound++;
            setTimeout(renderRound, delay);
        }

        function showResults() {
            document.getElementById('game-screen').classList.add('hidden');
            document.getElementById('results-screen').classList.remove('hidden');

            const summary = document.getElementById('stats-summary');
            state.players.forEach(p => {
                const total = state.questionsPerPlayer;
                const hit = state.scores[p];
                const pct = ((hit / total) * 100).toFixed(1);
                summary.innerHTML += `
                    <div style="border: 2px solid var(--accent); padding: 15px; border-radius: 12px; min-width: 150px;">
                        <strong style="font-size: 1.2em;">${p}</strong><br>
                        <span style="font-size: 1.5em; color: var(--accent);">${pct}%</span><br>
                        <small>${hit} de ${total} correctas</small>
                    </div>`;
            });

            const tbody = document.querySelector('#history-table tbody');
            state.history.forEach(h => {
                const row = `<tr><td>${h.player}</td><td>${h.esp}</td><td>${h.selected}</td><td>${h.status}</td></tr>`;
                tbody.innerHTML += row;
            });
        }
