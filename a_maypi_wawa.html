<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MAYPI WAWA KACHKAN ?</title>
    <style>
        :root {
            --primary-color: #2c3e50;
            --secondary-color: #3498db;
            --success-color: #2ecc71;
            --error-color: #e74c3c;
            --background-color: #f4f7f6;
            --box-color: #d35400; /* Color café/naranja opaco de la caja */
            --box-border: #a04000;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--background-color);
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 10px;
        }

        .container {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
            width: 100%;
            max-width: 500px;
            text-align: center;
        }

        h1 {
            color: var(--primary-color);
            font-size: 1.6rem;
            margin-bottom: 15px;
        }

        .author {
            font-size: 0.85rem;
            color: #7f8c8d;
            margin-top: 15px;
            font-weight: bold;
        }

        /* Configuración e Inicio */
        .form-group {
            margin-bottom: 15px;
            text-align: left;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
            font-size: 0.9rem;
        }

        textarea, input[type="number"] {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 1rem;
        }

        textarea {
            resize: vertical;
            min-height: 80px;
        }

        .btn {
            background-color: var(--secondary-color);
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 1rem;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            font-weight: bold;
            transition: background 0.3s;
        }

        .btn:hover {
            background-color: #2980b9;
        }

        /* Zona de Juego */
        .game-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 15px;
            font-weight: bold;
            font-size: 0.9rem;
            background: #ecf0f1;
            padding: 8px;
            border-radius: 6px;
        }

        /* Escenario Visual */
        .stage-container {
            position: relative;
            width: 270px;
            height: 270px;
            margin: 10px auto;
            border: 2px dashed #bdc3c7;
            border-radius: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #ffffff;
            overflow: hidden;
        }

        /* La Caja Principal */
        .box {
            width: 100px;
            height: 100px;
            background-color: var(--box-color);
            border: 3px solid var(--box-border);
            border-radius: 6px;
            position: absolute;
            z-index: 2; /* Capa intermedia */
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-weight: bold;
            box-shadow: 0 6px 12px rgba(0,0,0,0.25);
            user-select: none;
        }

        /* Solapa superior para simular que está adentro */
        .box-open-lid {
            display: none;
            position: absolute;
            top: -12px;
            width: 100px;
            height: 14px;
            background-color: #e67e22;
            border: 2px solid var(--box-border);
            border-bottom: none;
            border-radius: 4px 4px 0 0;
            z-index: 4;
        }

        .wawa {
            font-size: 50px;
            position: absolute;
            transition: all 0.2s ease;
            user-select: none;
            line-height: 1;
        }

        /* --- POSICIONAMIENTO PRECISO --- */
        
        /* 1. QHIPANPI (Detrás): El bebé está detrás de la caja (z-index: 1). */
        .pos-qhipanpi {
            top: 60px;
            left: 110px;
            z-index: 1;
            transform: scale(0.9);
        }

        /* 2. ñawpaqpi (Delante): 
           El bebé es MÁS GRANDE QUE LA CAJA (120px) y su centro coincida 
           exactamente con el vértice frontal/inferior izquierdo de la caja. */
        .pos-nawpaqninpi {
            font-size: 120px;
            z-index: 5;
            top: 50%;
            left: 50%;
            /* Vértice inferior izquierdo de una caja 100x100: translate(-100px, 0px) ubica el centro exactamente en la esquina */
            transform: translate(-100px, 0px);
            filter: drop-shadow(0 10px 10px rgba(0,0,0,0.4));
        }

        /* 3. UKHUNPI (Adentro): Asomándose dentro de la caja */
        .pos-ukhunpi {
            top: 75px;
            z-index: 3;
            font-size: 42px;
            clip-path: inset(0 0 15px 0);
        }

        /* 4. PATANPI (Encima) */
        .pos-patanpi {
            top: 30px;
            z-index: 3;
        }

        /* 5. URANPI (Debajo) */
        .pos-uranpi {
            bottom: 30px;
            z-index: 3;
        }

        /* 6. LLUQ'INPI (Izquierda) */
        .pos-lluqinpi {
            left: 20px;
            z-index: 3;
        }

        /* 7. PAÑANPI (Derecha) */
        .pos-pananpi {
            right: 20px;
            z-index: 3;
        }

        /* 8. jawapi (Afuera lejos) */
        .pos-jawapi {
            top: 15px;
            right: 15px;
            z-index: 3;
        }

        /* Opciones de Respuesta */
        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 15px;
        }

        .btn-option {
            background-color: #ffffff;
            border: 2px solid var(--secondary-color);
            color: var(--primary-color);
            padding: 10px;
            font-size: 0.95rem;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-option:hover {
            background-color: var(--secondary-color);
            color: white;
        }

        /* Retroalimentación Mensajes con Traducción */
        .feedback-container {
            min-height: 65px;
            margin-top: 10px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .feedback-main {
            font-size: 1.8rem;
            font-weight: bold;
            line-height: 1.1;
        }

        .feedback-translation {
            font-size: 1.1rem;
            font-weight: 600;
            margin-top: 4px;
        }

        .allin-text { color: var(--success-color); }
        .allin-translation { color: #2980b9; } /* Azul para la traducción de la respuesta */

        .mana-text { 
            color: var(--error-color); 
            font-size: 2.2rem; 
            animation: shake 0.3s; 
        }
        .mana-translation { color: #e67e22; } /* Naranja/Salmón para error */

        @keyframes shake {
            0% { transform: translateX(0); }
            25% { transform: translateX(-8px); }
            50% { transform: translateX(8px); }
            75% { transform: translateX(-8px); }
            100% { transform: translateX(0); }
        }

        /* Tabla de Resultados */
        .history-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
            font-size: 0.85rem;
        }

        .history-table th, .history-table td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: center;
        }

        .history-table th {
            background-color: var(--primary-color);
            color: white;
        }

        .meta-info {
            text-align: left;
            font-size: 0.85rem;
            margin-bottom: 10px;
            background: #eaeaea;
            padding: 10px;
            border-radius: 6px;
        }

        .hidden { display: none; }
    </style>
</head>
<body>

    <div class="container">
        <!-- VISTA 1: CONFIGURACIÓN E INICIO -->
        <div id="setup-view">
            <h1>MAYPI WAWA KACHKAN ?</h1>
            
            <div class="form-group">
                <label for="participants">Participantes (un nombre por fila):</label>

                <textarea id="participants" placeholder="Ejemplo:&#10;Juan&#10;María&#10;Pedro">Juan&#10;María</textarea>
            </div>

            <div class="form-group">
                <label for="max-questions">Número de preguntas (máx. 100):</label>
                <input type="number" id="max-questions" min="1" max="100" value="10">
            </div>

            <div class="form-group">
                <label for="delay-time">Tiempo de transición en acierto (segundos):</label>
                <input type="number" id="delay-time" min="1" max="5" value="2">
            </div>

            <button class="btn" onclick="startGame()">Qallariy (Empezar)</button>

            <div class="author">Yachachiq: M.Sc. Bladimir Arias Mejia</div>
        </div>

        <!-- VISTA 2: DESARROLLO DEL JUEGO -->
        <div id="game-view" class="hidden">
            <h1>MAYPI WAWA KACHKAN ?</h1>
            
            <div class="game-header">
                <div>Turno: <span id="current-player" style="color:var(--secondary-color);"></span></div>
                <div>Pregunta: <span id="question-count">0</span>/<span id="total-questions">0</span></div>
            </div>

            <div class="stage-container">
                <div class="box" id="main-box">
                    Caja
                    <div class="box-open-lid" id="box-lid"></div>
                </div>
                <div id="wawa" class="wawa">👶</div>
            </div>

            <div class="feedback-container">
                <div id="feedback-main" class="feedback-main"></div>
                <div id="feedback-translation" class="feedback-translation"></div>
            </div>

            <div id="options-container" class="options-grid"></div>
        </div>

        <!-- VISTA 3: HISTORIAL Y RESULTADOS -->
        <div id="results-view" class="hidden">
            <h1>Pukllana Tukukun (Fin del Juego)</h1>
            
            <div class="meta-info" id="meta-info"></div>

            <h3>Historial y Puntajes</h3>
            <table class="history-table">
                <thead>
                    <tr>
                        <th>Participante</th>
                        <th>Correctas</th>
                        <th>Incorrectas</th>
                        <th>Puntaje (%)</th>
                    </tr>
                </thead>
                <tbody id="history-body"></tbody>
            </table>

            <br>
            <button class="btn" onclick="location.reload()">Juktawan Pukllay (Volver a Jugar)</button>
        </div>
    </div>

    <script>
        // Base de datos de posiciones espaciales
        const database = [
            { key: "ñawpaqpi", translation: "Delante", class: "pos-nawpaqninpi" },
            { key: "qhipanpi", translation: "Detrás", class: "pos-qhipanpi" },
            { key: "patanpi", translation: "Encima", class: "pos-patanpi" },
            { key: "uranpi", translation: "Debajo", class: "pos-uranpi" },
            { key: "lluq'inpi", translation: "A la izquierda", class: "pos-lluqinpi" },
            { key: "pañanpi", translation: "A la derecha", class: "pos-pananpi" },
            { key: "ukhunpi", translation: "Adentro", class: "pos-ukhunpi" },
            { key: "jawapi", translation: "Afuera", class: "pos-jawapi" }
        ];

        // Estado del Juego
        let players = [];
        let currentPlayerIndex = 0;
        let maxQuestions = 10;
        let currentQuestion = 0;
        let delayTime = 2000;
        let currentTarget = null;
        let isWaiting = false;

        // Tiempos y Fechas
        let startTime, endTime;

        // Estructura de puntuación por participante
        let stats = {};

        function startGame() {
            // Lectura de participantes
            const rawPlayers = document.getElementById('participants').value.split('\n');
            players = rawPlayers.map(p => p.trim()).filter(p => p.length > 0);

            if (players.length === 0) {
                alert("Por favor, ingrese al menos un participante.");
                return;
            }

            // Lectura del número de preguntas
            const numInput = parseInt(document.getElementById('max-questions').value);
            if (isNaN(numInput) || numInput < 1 || numInput > 100) {
                alert("Ingrese un número válido de preguntas (entre 1 y 100).");
                return;
            }
            maxQuestions = numInput;

            // Configuración del tiempo de retardo
            const delayInput = parseFloat(document.getElementById('delay-time').value);
            delayTime = (isNaN(delayInput) || delayInput < 1 ? 2 : delayInput) * 1000;

            // Inicialización de estadísticas por jugador
            stats = {};
            players.forEach(player => {
                stats[player] = { correct: 0, incorrect: 0 };
            });

            // Registro de tiempo de inicio
            startTime = new Date();

            // Transición de Vista
            document.getElementById('setup-view').classList.add('hidden');
            document.getElementById('game-view').classList.remove('hidden');

            document.getElementById('total-questions').innerText = maxQuestions;

            // Iniciar primera pregunta
            nextQuestion();
        }

        function nextQuestion() {
            if (currentQuestion >= maxQuestions) {
                endGame();
                return;
            }

            isWaiting = false;
            currentQuestion++;
            
            // Actualización de Turno Intercalado
            const currentPlayer = players[currentPlayerIndex];
            document.getElementById('current-player').innerText = currentPlayer;
            document.getElementById('question-count').innerText = currentQuestion;
            
            // Limpiar Mensajes
            document.getElementById('feedback-main').innerText = "";
            document.getElementById('feedback-main').className = "feedback-main";
            document.getElementById('feedback-translation').innerText = "";
            document.getElementById('feedback-translation').className = "feedback-translation";

            // Selección de pregunta al azar
            currentTarget = database[Math.floor(Math.random() * database.length)];

            // Tapa abierta para ukhunpi
            const boxLid = document.getElementById('box-lid');
            if (currentTarget.key === "ukhunpi") {
                boxLid.style.display = "block";
            } else {
                boxLid.style.display = "none";
            }

            // Aplicar posicionamiento visual al WAWA
            const wawaEl = document.getElementById('wawa');
            wawaEl.className = "wawa " + currentTarget.class;

            // Renderizado de botones de opciones
            renderOptions();
        }

        function renderOptions() {
            const container = document.getElementById('options-container');
            container.innerHTML = "";

            // Duplicar y desordenar opciones de la base de datos
            const shuffledOptions = [...database].sort(() => Math.random() - 0.5);

            shuffledOptions.forEach(option => {
                const btn = document.createElement('button');
                btn.className = "btn-option";
                btn.innerText = option.key;
                btn.onclick = () => checkAnswer(option);
                container.appendChild(btn);
            });
        }

        function checkAnswer(selectedOption) {
            if (isWaiting) return;

            const currentPlayer = players[currentPlayerIndex];
            const mainFeedback = document.getElementById('feedback-main');
            const translationFeedback = document.getElementById('feedback-translation');

            if (selectedOption.key === currentTarget.key) {
                // Respuesta CORRECTA
                isWaiting = true;
                stats[currentPlayer].correct++;

                mainFeedback.innerText = "ALLIN";
                mainFeedback.className = "feedback-main allin-text";

                // Muestra la traducción de la respuesta seleccionada
                translationFeedback.innerText = `(${selectedOption.translation})`;
                translationFeedback.className = "feedback-translation allin-translation";

                // Avanzar al siguiente participante
                currentPlayerIndex = (currentPlayerIndex + 1) % players.length;

                // Pasar a la siguiente pregunta tras el tiempo configurado
                setTimeout(() => {
                    nextQuestion();
                }, delayTime);

            } else {
                // Respuesta INCORRECTA
                stats[currentPlayer].incorrect++;

                mainFeedback.innerText = "MANA ALLINCHU";
                mainFeedback.className = "feedback-main mana-text";

                // Muestra la traducción de la opción incorrecta presionada
                translationFeedback.innerText = `(${selectedOption.translation})`;
                translationFeedback.className = "feedback-translation mana-translation";
            }
        }

        function endGame() {
            endTime = new Date();

            // Ocultar juego y mostrar resultados
            document.getElementById('game-view').classList.add('hidden');
            document.getElementById('results-view').classList.remove('hidden');

            // Formateo de tiempos
            const optionsDate = { year: 'numeric', month: '2-digit', day: '2-digit' };
            const optionsTime = { hour: '2-digit', minute: '2-digit', second: '2-digit' };

            const fecha = startTime.toLocaleDateString('es-ES', optionsDate);
            const horaInicio = startTime.toLocaleTimeString('es-ES', optionsTime);
            const horaFin = endTime.toLocaleTimeString('es-ES', optionsTime);

            // Cálculo de tiempo transcurrido en segundos/minutos
            const durationMs = endTime - startTime;
            const totalSeconds = Math.floor(durationMs / 1000);
            const minutes = Math.floor(totalSeconds / 60);
            const seconds = totalSeconds % 60;
            const tiempoJuego = `${minutes}m ${seconds}s`;

            // Insertar datos en la sección superior
            document.getElementById('meta-info').innerHTML = `
                <strong>Fecha:</strong> ${fecha}<br>
                <strong>Hora Inicio:</strong> ${horaInicio}<br>
                <strong>Hora Final:</strong> ${horaFin}<br>
                <strong>Tiempo Total de Juego:</strong> ${tiempoJuego}
            `;

            // Renderizar la tabla con el historial y porcentajes
            const tbody = document.getElementById('history-body');
            tbody.innerHTML = "";

            players.forEach(player => {
                const pStats = stats[player];
                const totalAnswers = pStats.correct + pStats.incorrect;
                const percentage = totalAnswers > 0 
                    ? ((pStats.correct / totalAnswers) * 100).toFixed(1) 
                    : "0.0";

                const row = document.createElement('tr');
                row.innerHTML = `
                    <td><strong>${player}</strong></td>
                    <td style="color:var(--success-color);">${pStats.correct}</td>
                    <td style="color:var(--error-color);">${pStats.incorrect}</td>
                    <td><strong>${percentage}%</strong></td>
                `;
                tbody.appendChild(row);
            });
        }
    </script>
</body>
</html>
