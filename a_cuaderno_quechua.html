    <style>
        :root {
            --primary-color: #2c3e50;
            --secondary-color: #3498db;
            --bg-color: #f4f7f6;
            --card-bg: #ffffff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: #333;
            padding: 10px;
            display: flex;
            justify-content: center;
        }

        .main-container {
            width: 100%;
            max-width: 950px;
            background: var(--card-bg);
            padding: 15px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        h1, h2, h3 {
            text-align: center;
            color: var(--primary-color);
            margin-bottom: 15px;
        }

        .author {
            text-align: center;
            font-size: 0.85rem;
            color: #555;
            margin-top: 20px;
            font-weight: bold;
        }

        .btn {
            background-color: var(--secondary-color);
            color: white;
            border: none;
            padding: 10px 18px;
            font-size: 0.95rem;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            justify-content: center;
        }

        .btn:hover {
            background-color: #2980b9;
        }

        .btn-success { background-color: #2ecc71; }
        .btn-success:hover { background-color: #27ae60; }
        .btn-warning { background-color: #f39c12; }
        .btn-warning:hover { background-color: #d35400; }

        .hidden { display: none !important; }

        /* Formulario Inicial */
        .form-group {
            margin-bottom: 12px;
            text-align: left;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
            font-size: 0.9rem;
        }

        input, textarea, select {
            width: 100%;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 0.95rem;
        }

        .config-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 10px;
            background: #f8f9fa;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 15px;
        }

        /* BANNER DE INFORMACIÓN (Fila Superior) */
        .info-card {
            background: #ffffff;
            padding: 8px 12px;
            border-radius: 8px;
            border: 1px solid #dcdde1;
            border-left: 5px solid var(--secondary-color);
            margin-bottom: 12px;
            font-size: 0.85rem;
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            gap: 8px;
            align-items: center;
        }

        .btn-map {
            background-color: #e74c3c;
            color: white;
            border: none;
            padding: 3px 8px;
            font-size: 0.75rem;
            border-radius: 4px;
            cursor: pointer;
            margin-left: 5px;
            font-weight: bold;
            display: inline-flex;
            align-items: center;
            gap: 3px;
        }

        .btn-map:hover {
            background-color: #c0392b;
        }

        /* FILA DE BOTONES DE ACCESO RÁPIDO (GRID COMPACTA SIN DESLIZADOR) */
        .quick-access-bar {
            display: grid;
            grid-template-columns: repeat(9, 1fr);
            gap: 4px;
            margin-bottom: 12px;
            width: 100%;
        }

        .icon-btn {
            width: 100%;
            height: 65px;
            background: #ffffff;
            border: 1.5px solid var(--secondary-color);
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.7rem;
            text-align: center;
            font-weight: bold;
            color: var(--primary-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 3px;
            padding: 2px;
            transition: all 0.2s ease;
        }

        .icon-btn i {
            font-size: 1.1rem;
            color: var(--secondary-color);
        }

        .icon-btn:hover {
            background: var(--secondary-color);
            color: white;
        }

        .icon-btn:hover i {
            color: white;
        }

        /* CONTROL DE VISTA COMPACTO */
        .view-control {
            display: flex;
            gap: 6px;
            justify-content: center;
            margin-bottom: 10px;
        }

        .btn-view {
            background-color: var(--secondary-color);
            color: white;
            border: none;
            padding: 4px 10px;
            font-size: 0.75rem;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            transition: background 0.2s;
        }

        .btn-view:hover {
            background-color: #2980b9;
        }

        /* ÁREA DE TRABAJO PRINCIPAL (ORACIÓN) */
        .editor-container {
            display: flex;
            gap: 12px;
            margin-bottom: 15px;
        }

        .editor-box {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .editor-box label {
            font-weight: bold;
            color: #2c3e50;
            font-size: 0.95rem;
        }

        .editor-box textarea {
            min-height: 180px;
            resize: vertical;
            padding: 10px;
            border-radius: 8px;
            border: 2px solid #333;
            font-size: 1rem;
        }

        /* BOTONES DE ACCIÓN (ABAJO) */
        .action-bar {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-top: 10px;
            margin-bottom: 5px;
        }

        /* Ventana Emergente Modal */
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 15px;
        }

        .modal-content {
            background: white;
            padding: 20px;
            border-radius: 12px;
            width: 100%;
            max-width: 600px;
            max-height: 85vh;
            overflow-y: auto;
            position: relative;
        }

        .close-btn {
            position: absolute;
            top: 10px;
            right: 15px;
            font-size: 1.5rem;
            cursor: pointer;
            color: #7f8c8d;
        }

        .search-box {
            margin-bottom: 12px;
        }

        /* Tablas del Modal */
        .data-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }

        .data-table th, .data-table td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: left;
            font-size: 0.85rem;
        }

        .data-table th {
            background-color: var(--primary-color);
            color: white;
        }

        /* Adaptación para pantallas móviles */
        @media (max-width: 600px) {
            .quick-access-bar {
                gap: 2px;
            }
            .icon-btn {
                height: 52px;
                font-size: 0.55rem;
                border-width: 1px;
                border-radius: 5px;
            }
            .icon-btn i {
                font-size: 0.85rem;
            }
            .editor-container {
                flex-direction: column;
            }
            .action-bar {
                flex-direction: column;
            }
            .btn {
                width: 100%;
            }
        }
    </style>
</head>
<body>

    <div class="main-container">
        
        <!-- VISTA INICIAL: CONFIGURACIÓN Y PARTICIPANTE -->
        <div id="init-view">
            <h1>CUADERNO VIRTUAL QUECHUA</h1>
            
            <div class="form-group">
                <label for="participant-input">Nombre del Participante:</label>
                <textarea id="participant-input" placeholder="Escriba aquí el nombre del participante..."></textarea>
            </div>

            <h3>Configuración de Apariencia del Área de Trabajo</h3>
            <div class="config-grid">
                <div>
                    <label>Fondo Quechua:</label>
                    <input type="color" id="bg-quechua" value="#ffffff">
                </div>
                <div>
                    <label>Letra Quechua:</label>
                    <input type="color" id="color-quechua" value="#2c3e50">
                </div>
                <div>
                    <label>Fuente Quechua:</label>
                    <select id="font-quechua">
                        <option value="Segoe UI">Segoe UI</option>
                        <option value="Arial">Arial</option>
                        <option value="Courier New">Courier New</option>
                        <option value="Georgia">Georgia</option>
                    </select>
                </div>
                <div>
                    <label>Tamaño Quechua (px):</label>
                    <input type="number" id="size-quechua" value="16" min="12" max="32">
                </div>

                <div>
                    <label>Fondo Castellano:</label>
                    <input type="color" id="bg-castellano" value="#ffffff">
                </div>
                <div>
                    <label>Letra Castellano:</label>
                    <input type="color" id="color-castellano" value="#2c3e50">
                </div>
                <div>
                    <label>Fuente Castellano:</label>
                    <select id="font-castellano">
                        <option value="Segoe UI">Segoe UI</option>
                        <option value="Arial">Arial</option>
                        <option value="Courier New">Courier New</option>
                        <option value="Georgia">Georgia</option>
                    </select>
                </div>
                <div>
                    <label>Tamaño Castellano (px):</label>
                    <input type="number" id="size-castellano" value="16" min="12" max="32">
                </div>
            </div>

            <button class="btn btn-success" style="width: 100%;" onclick="startApp()">Ingresar al Cuaderno</button>
            <div class="author">Yachachiq: M.Sc. Bladimir Arias Mejia</div>
        </div>

        <!-- VISTA PRINCIPAL DEL CUADERNO VIRTUAL -->
        <div id="app-view" class="hidden">

            <!-- 1. FILA SUPERIOR: Info del Participante, Fecha y Ubicación con Botón a Google Maps -->
            <div class="info-card" id="export-header">
                <div><strong>Participante:</strong> <span id="disp-participant">No especificado</span></div>
                <div><strong>Fecha y Hora:</strong> <span id="disp-datetime">--/--/---- --:--</span></div>
                <div>
                    <strong>UBICACIÓN:</strong> <span id="disp-coords">Obteniendo ubicación...</span>
                    <button id="btn-google-maps" class="btn-map hidden" onclick="openGoogleMaps()">
                        <i class="fa-solid fa-map-location-dot"></i> Ver Mapa
                    </button>
                </div>
            </div>

            <!-- 2. FILA DE BOTONES DE ACCESO RÁPIDO (TODOS EN UNA FILA SIN DESLIZADOR EN MÓVIL) -->
            <div class="quick-access-bar">
                <button class="icon-btn" onclick="openModal('verbos')"><i class="fa-solid fa-running"></i> Verbos</button>
                <button class="icon-btn" onclick="openModal('sufijos_nom')"><i class="fa-solid fa-link"></i> Suf. Nom.</button>
                <button class="icon-btn" onclick="openModal('sustantivos')"><i class="fa-solid fa-cat"></i> Sustantivos</button>
                <button class="icon-btn" onclick="openModal('sufijos_pos')"><i class="fa-solid fa-user-tag"></i> Suf. Pos.</button>
                <button class="icon-btn" onclick="openModal('pronombres_pers')"><i class="fa-solid fa-users"></i> Pron. Pers.</button>
                <button class="icon-btn" onclick="openModal('pronombres_interr')"><i class="fa-solid fa-question-circle"></i> Pron. Interr.</button>
                <button class="icon-btn" onclick="openModal('sufijos_pres')"><i class="fa-solid fa-clock"></i> Suf. Pres.</button>
                <button class="icon-btn" onclick="openModal('sufijos_pas')"><i class="fa-solid fa-history"></i> Suf. Pas.</button>
                <button class="icon-btn" onclick="openModal('sufijos_fut')"><i class="fa-solid fa-hourglass-end"></i> Suf. Fut.</button>
            </div>

            <!-- BOTONES PEQUEÑOS DE VISUALIZACIÓN -->
            <div class="view-control">
                <button class="btn-view" onclick="setView('both')">Mostrar Ambos</button>
                <button class="btn-view" onclick="setView('quechua')">Solo Quechua</button>
                <button class="btn-view" onclick="setView('castellano')">Solo Castellano</button>
            </div>

            <!-- 3. ÁREA DE TRABAJO PRINCIPAL (ORACIÓN) -->
            <div class="editor-container" id="editor-container">
                <div class="editor-box" id="box-quechua">
                    <label>Quechua:</label>
                    <textarea id="text-quechua" placeholder="Qillqay kaypi..."></textarea>
                </div>
                <div class="editor-box" id="box-castellano">
                    <label>Castellano:</label>
                    <textarea id="text-castellano" placeholder="Escriba aquí..."></textarea>
                </div>
            </div>

            <!-- 4. FILA DE BOTONES DE ACCIÓN (ABAJO) -->
            <div class="action-bar">
                <button class="btn btn-success" onclick="saveJSON()"><i class="fa-solid fa-floppy-disk"></i> Guardar (.json)</button>
                <button class="btn btn-warning" onclick="document.getElementById('file-input').click()"><i class="fa-solid fa-folder-open"></i> Abrir (.json)</button>
                <input type="file" id="file-input" class="hidden" accept=".json" onchange="loadJSON(event)">
                <button class="btn" onclick="downloadPDF()"><i class="fa-solid fa-file-pdf"></i> Descargar (PDF)</button>
            </div>

            <!-- FIRMA AUTOR -->
            <div class="author">Yachachiq: M.Sc. Bladimir Arias Mejia</div>
        </div>

    </div>

    <!-- VENTANA EMERGENTE (MODAL) -->
    <div id="data-modal" class="modal hidden">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal()">&times;</span>
            <h3 id="modal-title">Título</h3>
            <div id="search-container" class="search-box hidden">
                <input type="text" id="modal-search" placeholder="Buscar palabra (Quechua o Español)..." onkeyup="filterModalData()">
            </div>
            <div id="modal-body"></div>
        </div>
    </div>

                    { p: "Ñuqayku", s1: "sayku", s2: "-chka-sayku" },
                    { p: "Qamkuna", s1: "nkichik", s2: "-chka-nkichik" },
                    { p: "Paykuna", s1: "nqanku", s2: "-chka-nqanku" }
                ]
            }
        };

        let currentModalCategory = "";
        let userLat = null;
        let userLon = null;

        // --- INICIALIZACIÓN ---
        function startApp() {
            let participant = document.getElementById('participant-input').value.trim();
            if (!participant) {
                participant = "No especificado";
            }
            document.getElementById('disp-participant').innerText = participant;

            const now = new Date();
            document.getElementById('disp-datetime').innerText = now.toLocaleString('es-ES');

            // Obtener Ubicación GPS
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    pos => {
                        userLat = pos.coords.latitude.toFixed(5);
                        userLon = pos.coords.longitude.toFixed(5);
                        document.getElementById('disp-coords').innerText = `Lat: ${userLat}, Lon: ${userLon}`;
                        document.getElementById('btn-google-maps').classList.remove('hidden');
                    },
                    err => {
                        document.getElementById('disp-coords').innerText = "No disponible";
                    }
                );
            } else {
                document.getElementById('disp-coords').innerText = "No soportada";
            }

            const txtQ = document.getElementById('text-quechua');
            txtQ.style.backgroundColor = document.getElementById('bg-quechua').value;
            txtQ.style.color = document.getElementById('color-quechua').value;
            txtQ.style.fontFamily = document.getElementById('font-quechua').value;
            txtQ.style.fontSize = document.getElementById('size-quechua').value + "px";

            const txtC = document.getElementById('text-castellano');
            txtC.style.backgroundColor = document.getElementById('bg-castellano').value;
            txtC.style.color = document.getElementById('color-castellano').value;
            txtC.style.fontFamily = document.getElementById('font-castellano').value;
            txtC.style.fontSize = document.getElementById('size-castellano').value + "px";

            document.getElementById('init-view').classList.add('hidden');
            document.getElementById('app-view').classList.remove('hidden');
        }

        // --- ABRIR MAPA EN GOOGLE MAPS ---
        function openGoogleMaps() {
            if (userLat && userLon) {
                const mapUrl = `https://www.google.com/maps?q=${userLat},${userLon}`;
                window.open(mapUrl, '_blank');
            } else {
                alert("No se tienen coordenadas disponibles para mostrar el mapa.");
            }
        }

        // --- CONTROL DE VISTAS ---
        function setView(mode) {
            const boxQ = document.getElementById('box-quechua');
            const boxC = document.getElementById('box-castellano');

            if (mode === 'both') {
                boxQ.classList.remove('hidden');
                boxC.classList.remove('hidden');
            } else if (mode === 'quechua') {
                boxQ.classList.remove('hidden');
                boxC.classList.add('hidden');
            } else if (mode === 'castellano') {
                boxQ.classList.add('hidden');
                boxC.classList.remove('hidden');
            }
        }

        // --- VENTANA EMERGENTE (MODAL) Y BUSCADOR ---
        function openModal(category) {
            currentModalCategory = category;
            const modal = document.getElementById('data-modal');
            const title = document.getElementById('modal-title');
            const searchContainer = document.getElementById('search-container');
            const searchInput = document.getElementById('modal-search');

            searchInput.value = "";
            modal.classList.remove('hidden');

            if (category === 'verbos' || category === 'sustantivos') {
                searchContainer.classList.remove('hidden');
            } else {
                searchContainer.classList.add('hidden');
            }

            let categoryNames = {
                verbos: "Verbos",
                sustantivos: "Sustantivos",
                sufijos_nom: "Sufijos Nominales",
                sufijos_pos: "Sufijos Posesivos",
                pronombres_pers: "Pronombres Personales",
                pronombres_interr: "Pronombres Interrogativos",
                sufijos_pres: "Sufijos del Presente",
                sufijos_pas: "Sufijos del Pasado",
                sufijos_fut: "Sufijos del Futuro"
            };

            title.innerText = categoryNames[category] || "Información";
            renderModalData(category, "");
        }

        function closeModal() {
            document.getElementById('data-modal').classList.add('hidden');
        }

        function filterModalData() {
            const query = document.getElementById('modal-search').value.toLowerCase();
            renderModalData(currentModalCategory, query);
        }

        function renderModalData(category, filter) {
            const body = document.getElementById('modal-body');
            let html = "";

            if (category === 'verbos' || category === 'sustantivos' || category === 'sufijos_nom' || category === 'pronombres_pers' || category === 'pronombres_interr') {
                let data = database[category];
                if (filter) {
                    data = data.filter(item => item.q.toLowerCase().includes(filter) || item.e.toLowerCase().includes(filter));
                }
                html = `<table class="data-table"><thead><tr><th>Quechua</th><th>Español</th></tr></thead><tbody>`;
                data.forEach(item => {
                    html += `<tr><td>${item.q}</td><td>${item.e}</td></tr>`;
                });
                html += `</tbody></table>`;
            } else if (category === 'sufijos_pos') {
                html = `<table class="data-table"><thead><tr><th>Pronombre</th><th>Sufijo</th></tr></thead><tbody>`;
                database.sufijos_pos.forEach(item => {
                    html += `<tr><td>${item.p}</td><td>${item.s}</td></tr>`;
                });
                html += `</tbody></table>`;
            } else if (category === 'sufijos_pres') {
                html += `<h4>Presente Simple</h4><table class="data-table"><thead><tr><th>Persona</th><th>Sufijo</th></tr></thead><tbody>`;
                database.sufijos_pres.simple.forEach(i => html += `<tr><td>${i.p}</td><td>${i.s}</td></tr>`);
                html += `</tbody></table><br><h4>Presente Continuo</h4><table class="data-table"><thead><tr><th>Persona</th><th>Simple</th><th>Continuo</th></tr></thead><tbody>`;
                database.sufijos_pres.continuo.forEach(i => html += `<tr><td>${i.p}</td><td>${i.s1}</td><td>${i.s2}</td></tr>`);
                html += `</tbody></table>`;
            } else if (category === 'sufijos_pas') {
                html += `<h4>Pretérito Perfecto</h4><table class="data-table"><thead><tr><th>Persona</th><th>Simple</th><th>Perfecto</th></tr></thead><tbody>`;
                database.sufijos_pas.perfecto.forEach(i => html += `<tr><td>${i.p}</td><td>${i.s1}</td><td>${i.s2}</td></tr>`);
                html += `</tbody></table><br><h4>Pretérito Imperfecto</h4><table class="data-table"><thead><tr><th>Persona</th><th>Simple</th><th>Imperfecto</th></tr></thead><tbody>`;
                database.sufijos_pas.imperfecto.forEach(i => html += `<tr><td>${i.p}</td><td>${i.s1}</td><td>${i.s2}</td></tr>`);
                html += `</tbody></table>`;
            } else if (category === 'sufijos_fut') {
                html += `<h4>Futuro Simple</h4><table class="data-table"><thead><tr><th>Persona</th><th>Sufijo</th></tr></thead><tbody>`;
                database.sufijos_fut.simple.forEach(i => html += `<tr><td>${i.p}</td><td>${i.s}</td></tr>`);
                html += `</tbody></table><br><h4>Futuro Continuo</h4><table class="data-table"><thead><tr><th>Persona</th><th>Simple</th><th>Continuo</th></tr></thead><tbody>`;
                database.sufijos_fut.continuo.forEach(i => html += `<tr><td>${i.p}</td><td>${i.s1}</td><td>${i.s2}</td></tr>`);
                html += `</tbody></table>`;
            }

            body.innerHTML = html;
        }

        // --- GUARDAR Y ABRIR JSON ---
        function saveJSON() {
            const data = {
                participante: document.getElementById('disp-participant').innerText,
                fechaHora: document.getElementById('disp-datetime').innerText,
                ubicacion: document.getElementById('disp-coords').innerText,
                oracionQuechua: document.getElementById('text-quechua').value,
                oracionCastellano: document.getElementById('text-castellano').value
            };

            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(data, null, 2));
            const downloadAnchor = document.createElement('a');
            downloadAnchor.setAttribute("href", dataStr);
            downloadAnchor.setAttribute("download", "oracion_quechua.json");
            document.body.appendChild(downloadAnchor);
            downloadAnchor.click();
            downloadAnchor.remove();
        }

        function loadJSON(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const data = JSON.parse(e.target.result);
                    if (data.oracionQuechua !== undefined) document.getElementById('text-quechua').value = data.oracionQuechua;
                    if (data.oracionCastellano !== undefined) document.getElementById('text-castellano').value = data.oracionCastellano;
                    if (data.participante) document.getElementById('disp-participant').innerText = data.participante;
                    alert("Archivo cargado con éxito.");
                } catch (err) {
                    alert("Error al leer el archivo JSON.");
                }
            };
            reader.readAsText(file);
        }

        // --- EXPORTAR A PDF ---
        function downloadPDF() {
            const element = document.createElement('div');
            element.style.padding = "20px";
            element.style.fontFamily = "Arial, sans-serif";

            const participant = document.getElementById('disp-participant').innerText;
            const datetime = document.getElementById('disp-datetime').innerText;
            const location = document.getElementById('disp-coords').innerText;
            const quechuaText = document.getElementById('text-quechua').value;
            const castellanoText = document.getElementById('text-castellano').value;

            let pdfContent = `
                <h2 style="text-align:center; color:#2c3e50;">CUADERNO VIRTUAL QUECHUA</h2>
                <hr><br>
                <div style="background:#f8f9fa; padding:15px; border-radius:6px; margin-bottom:20px;">
                    <p><strong>Participante:</strong> ${participant}</p>
                    <p><strong>Fecha y Hora:</strong> ${datetime}</p>
                    <p><strong>UBICACIÓN:</strong> ${location}</p>
                </div>
                <h3>Oración:</h3>
            `;

            if (quechuaText.trim() !== "") {
                pdfContent += `<div style="margin-bottom:15px;"><strong>Quechua:</strong><p style="background:#eef2f5; padding:10px; border-radius:5px;">${quechuaText}</p></div>`;
            }

            if (castellanoText.trim() !== "") {
                pdfContent += `<div style="margin-bottom:15px;"><strong>Castellano / Español:</strong><p style="background:#eef2f5; padding:10px; border-radius:5px;">${castellanoText}</p></div>`;
            }

            pdfContent += `<br><hr><p style="text-align:center; font-size:12px; color:#7f8c8d; margin-top:15px;">Yachachiq: M.Sc. Bladimir Arias Mejia</p>`;

            element.innerHTML = pdfContent;

            const opt = {
                margin:       10,
                filename:     'cuaderno_quechua.pdf',
                image:        { type: 'jpeg', quality: 0.98 },
                html2canvas:  { scale: 2 },
                jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' }
            };

            html2pdf().set(opt).from(element).save();
        }
    </script>
</body>
</html>
