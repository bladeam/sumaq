<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestor de Horario Universitario</title>
  <style>
    :root {
      --bg-primary: #f8fafc;
      --card-bg: #ffffff;
      --text-main: #1e293b;
      --border-color: #cbd5e1;
      --accent: #2563eb;
      --accent-hover: #1d4ed8;
      --danger: #ef4444;
    }

    * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: var(--bg-primary); color: var(--text-main); margin: 0; padding: 20px; }

    .container { max-width: 1200px; margin: 0 auto; }
    
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      flex-wrap: wrap;
      gap: 10px;
    }

    h1 { margin: 0; font-size: 1.8rem; color: #0f172a; }

    .btn-group { display: flex; gap: 10px; }
    
    button {
      background-color: var(--accent);
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      transition: background 0.2s;
    }
    button:hover { background-color: var(--accent-hover); }
    button.btn-danger { background-color: var(--danger); }
    button.btn-danger:hover { background-color: #dc2626; }
    button.btn-secondary { background-color: #64748b; }
    button.btn-secondary:hover { background-color: #475569; }

    .table-container {
      background: var(--card-bg);
      border-radius: 8px;
      box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 800px;
    }

    th, td {
      border: 1px solid var(--border-color);
      text-align: center;
      padding: 8px;
      width: 14%;
    }

    th {
      background-color: #e2e8f0;
      color: #334155;
      font-size: 0.9rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    th.time-col, td.time-col {
      width: 12%;
      font-weight: bold;
      background-color: #f1f5f9;
      font-size: 0.85rem;
    }

    td.slot {
      height: 70px;
      cursor: pointer;
      vertical-align: middle;
      transition: background-color 0.15s;
      position: relative;
    }
    td.slot:hover { background-color: #f1f5f9; }

    .cell-content {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100%;
      border-radius: 4px;
      padding: 4px;
    }

    .subject { font-weight: bold; font-size: 0.95rem; }
    .room { font-size: 0.8rem; opacity: 0.85; margin-top: 2px; }

    /* Estilos Modal */
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.5);
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }
    .modal-content {
      background: white;
      padding: 24px;
      border-radius: 8px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1);
    }
    .modal h2 { margin-top: 0; font-size: 1.25rem; }
    .form-group { margin-bottom: 15px; }
    .form-group label { display: block; margin-bottom: 5px; font-size: 0.9rem; font-weight: 600; }
    .form-group input {
      width: 100%;
      padding: 8px;
      border: 1px solid var(--border-color);
      border-radius: 4px;
    }
    .color-options { display: flex; gap: 8px; margin-top: 5px; }
    .color-picker {
      width: 25px; height: 25px; border-radius: 50%; cursor: pointer; border: 2px solid transparent;
    }
    .color-picker.selected { border-color: #000; }
    .modal-actions { display: flex; justify-content: space-between; gap: 10px; margin-top: 20px; }
  </style>
</head>
<body>

<div class="container">
  <header>
    <h1>Mi Horario de Clases</h1>
    <div class="btn-group">
      <button class="btn-secondary" onclick="exportData()">Exportar</button>
      <button class="btn-secondary" onclick="importData()">Importar</button>
      <button class="btn-danger" onclick="clearSchedule()">Limpiar Todo</button>
    </div>
  </header>

  <div class="table-container">
    <table id="scheduleTable">
      <thead>
        <tr>
          <th class="time-col">HORA</th>
          <th>LUNES</th>
          <th>MARTES</th>
          <th>MIÉRCOLES</th>
          <th>JUEVES</th>
          <th>VIERNES</th>
          <th>SÁBADO</th>
        </tr>
      </thead>
      <tbody id="tableBody"></tbody>
    </table>
  </div>
</div>

<!-- Modal para agregar / editar -->
<div class="modal" id="cellModal">
  <div class="modal-content">
    <h2 id="modalTitle">Editar Clase</h2>
    <div class="form-group">
      <label for="inputSubject">Materia / Sigla</label>
      <input type="text" id="inputSubject" placeholder="Ej. BD1, LOG MAT">
    </div>
    <div class="form-group">
      <label for="inputRoom">Aula / Grupo</label>
      <input type="text" id="inputRoom" placeholder="Ej. 202 B, A1S">
    </div>
    <div class="form-group">
      <label>Color de fondo</label>
      <div class="color-options">
        <div class="color-picker selected" style="background: #e2e8f0;" data-color="#e2e8f0"></div>
        <div class="color-picker" style="background: #fef08a;" data-color="#fef08a"></div>
        <div class="color-picker" style="background: #bbf7d0;" data-color="#bbf7d0"></div>
        <div class="color-picker" style="background: #bfdbfe;" data-color="#bfdbfe"></div>
        <div class="color-picker" style="background: #ddd6fe;" data-color="#ddd6fe"></div>
        <div class="color-picker" style="background: #fbcfe8;" data-color="#fbcfe8"></div>
      </div>
    </div>
    <div class="modal-actions">
      <button class="btn-danger" id="btnDelete" onclick="deleteCell()">Eliminar</button>
      <div>
        <button class="btn-secondary" onclick="closeModal()">Cancelar</button>
        <button onclick="saveCell()">Guardar</button>
      </div>
    </div>
  </div>
</div>

<script>
  const times = [
    "8:00 - 9:30",
    "9:45 - 11:15",
    "11:30 - 13:00",
    "15:15 - 16:45",
    "17:00 - 18:30",
    "18:45 - 20:15",
    "20:30 - 22:00"
  ];

  const days = ["LUNES", "MARTES", "MIÉRCOLES", "JUEVES", "VIERNES", "SÁBADO"];

  // Datos precargados iniciales según tu imagen
  const initialData = {
    "0-0": { subject: "A1S", room: "", color: "#e2e8f0" },
    "0-1": { subject: "IDI2", room: "ENF 302", color: "#e2e8f0" },
    "0-2": { subject: "IDI2", room: "MED 701 B", color: "#e2e8f0" },
    "0-3": { subject: "LOG MAT", room: "", color: "#e2e8f0" },
    "0-4": { subject: "A1S", room: "", color: "#e2e8f0" },
    
    "1-0": { subject: "A2S", room: "", color: "#bfdbfe" },
    "1-1": { subject: "IDI2", room: "OPT 601", color: "#e2e8f0" },
    "1-2": { subject: "IDI1", room: "MED 502 A", color: "#e2e8f0" },
    "1-3": { subject: "BD1", room: "202 B", color: "#fbcfe8" },
    "1-4": { subject: "A2S", room: "", color: "#bfdbfe" },
    "1-5": { subject: "IDI1", room: "PUN 501", color: "#e2e8f0" },

    "2-0": { subject: "IO2", room: "", color: "#bbf7d0" },
    "2-2": { subject: "BD1", room: "202 B", color: "#fbcfe8" },
    "2-4": { subject: "IO2", room: "", color: "#bbf7d0" },
    "2-5": { subject: "IDI2", room: "PUN 302", color: "#e2e8f0" },

    "3-0": { subject: "met", room: "", color: "#cbd5e1" },
    "3-1": { subject: "NUM 201", room: "", color: "#ddd6fe" },
    "3-2": { subject: "eco", room: "", color: "#cbd5e1" },
    "3-3": { subject: "met", room: "", color: "#cbd5e1" },
    "3-4": { subject: "eco", room: "", color: "#cbd5e1" },

    "4-0": { subject: "iso", room: "", color: "#cbd5e1" },
    "4-1": { subject: "PRO 301", room: "", color: "#fef08a" },
    "4-3": { subject: "NUM 201", room: "", color: "#ddd6fe" },
    "4-4": { subject: "iso", room: "", color: "#cbd5e1" },

    "5-0": { subject: "materi", room: "", color: "#cbd5e1" },
    "5-3": { subject: "PRO 301", room: "", color: "#fef08a" }
  };

  let scheduleData = JSON.parse(localStorage.getItem('userSchedule')) || initialData;
  let activeKey = null;
  let selectedColor = "#e2e8f0";

  function initTable() {
    const tbody = document.getElementById('tableBody');
    tbody.innerHTML = '';

    times.forEach((time, rowIndex) => {
      const tr = document.createElement('tr');
      
      const tdTime = document.createElement('td');
      tdTime.className = 'time-col';
      tdTime.textContent = time;
      tr.appendChild(tdTime);

      days.forEach((_, colIndex) => {
        const td = document.createElement('td');
        td.className = 'slot';
        const key = `${rowIndex}-${colIndex}`;
        
        if (scheduleData[key]) {
          renderCellContent(td, scheduleData[key]);
        }

        td.onclick = () => openModal(key);
        tr.appendChild(td);
      });

      tbody.appendChild(tr);
    });
  }

  function renderCellContent(td, data) {
    td.style.backgroundColor = data.color || '#ffffff';
    td.innerHTML = `
      <div class="cell-content">
        <span class="subject">${data.subject || ''}</span>
        <span class="room">${data.room || ''}</span>
      </div>
    `;
  }

  // Lógica del Modal
  function openModal(key) {
    activeKey = key;
    const data = scheduleData[key] || { subject: '', room: '', color: '#e2e8f0' };
    
    document.getElementById('inputSubject').value = data.subject || '';
    document.getElementById('inputRoom').value = data.room || '';
    setColor(data.color || '#e2e8f0');
    
    document.getElementById('btnDelete').style.display = scheduleData[key] ? 'block' : 'none';
    document.getElementById('cellModal').style.display = 'flex';
  }

  function closeModal() {
    document.getElementById('cellModal').style.display = 'none';
  }

  function setColor(color) {
    selectedColor = color;
    document.querySelectorAll('.color-picker').forEach(el => {
      if (el.dataset.color === color) {
        el.classList.add('selected');
      } else {
        el.classList.remove('selected');
      }
    });
  }

  document.querySelectorAll('.color-picker').forEach(el => {
    el.onclick = (e) => setColor(e.target.dataset.color);
  });

  function saveCell() {
    const subject = document.getElementById('inputSubject').value.trim();
    const room = document.getElementById('inputRoom').value.trim();

    if (subject === '' && room === '') {
      deleteCell();
      return;
    }

    scheduleData[activeKey] = { subject, room, color: selectedColor };
    saveAndRefresh();
    closeModal();
  }

  function deleteCell() {
    delete scheduleData[activeKey];
    saveAndRefresh();
    closeModal();
  }

  function saveAndRefresh() {
    localStorage.setItem('userSchedule', JSON.stringify(scheduleData));
    initTable();
  }

  function clearSchedule() {
    if (confirm("¿Estás seguro de que deseas borrar todo el horario?")) {
      scheduleData = {};
      saveAndRefresh();
    }
  }

  function exportData() {
    const blob = new Blob([JSON.stringify(scheduleData, null, 2)], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'horario.json';
    a.click();
  }

  function importData() {
    const input = document.createElement('input');
    input.type = 'file';
    input.accept = 'application/json';
    input.onchange = e => {
      const file = e.target.files[0];
      const reader = new FileReader();
      reader.onload = event => {
        try {
          scheduleData = JSON.parse(event.target.result);
          saveAndRefresh();
        } catch (err) {
          alert('El archivo no es válido.');
        }
      };
      reader.readAsText(file);
    };
    input.click();
  }

  // Inicializar al cargar
  initTable();
</script>
</body>
</html>
