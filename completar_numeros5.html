<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desafío Quechua - Pro</title>
    <style>
        :root {
            --primary: #2c3e50;
            --accent: #3498db;
            --success: #27ae60;
            --error: #e74c3c;
            --bg: #f4f7f6;
            --player-card: #8e44ad;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            padding: 20px;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .game-container {
            width: 95%;
            max-width: 900px;
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
        }

        h1 { text-align: center; color: var(--primary); margin-bottom: 10px; }

        #setup-screen { display: flex; flex-direction: column; gap: 15px; }
        textarea {
            width: 100%; height: 100px; padding: 12px; border-radius: 8px;
            border: 1px solid #ccc; resize: none; font-size: 1rem; box-sizing: border-box;
        }

        input[type="number"] {
            width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #ccc; box-sizing: border-box;
        }

        #turn-indicator {
            background: var(--player-card);
            color: white;
            padding: 10px 20px;
            border-radius: 50px;
            display: inline-block;
            font-weight: bold;
            margin-bottom: 20px;
        }

        .quechua-phrase {
            display: flex; flex-wrap: wrap; justify-content: center;
            gap: 12px; min-height: 70px; background: #fdfdfd;
            padding: 20px; border: 3px dashed #cbd5e0; border-radius: 12px; margin: 20px 0;
        }

        .blank {
            min-width: 90px; height: 50px; background: #fff;
            border: 2px solid #e2e8f0; border-radius: 8px;
            display: flex; align-items: center; justify-content: center;
            cursor: move; font-weight: bold; color: var(--primary);
        }

        .blank.over { border-color: var(--accent); background: #ebf8ff; }

        #options-container {
            display: flex; flex-wrap: wrap; justify-content: center;
            gap: 10px; padding: 20px; background: #edf2f7; border-radius: 12px;
        }

        .option {
            background: var(--accent); color: white; padding: 10px 18px;
            border-radius: 8px; cursor: grab; user-select: none; font-weight: 500;
        }

        #results-modal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9); overflow-y: auto; z-index: 2000; padding: 40px 10px;
        }

        .modal-content {
            background: white; width: 95%; max-width: 800px; margin: auto; padding: 30px; border-radius: 15px;
        }

        .summary-box {
            background: #f1f2f6; padding: 20px; border-radius: 12px; margin-bottom: 20px;
            display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 15px;
        }

        .summary-item {
            text-align: center; padding: 15px; background: white; border-radius: 10px; border-bottom: 4px solid var(--accent);
        }

        .history-table { width: 100%; border-collapse: collapse; font-size: 0.85rem; margin-top: 10px; }
        .history-table th, .history-table td { text-align: left; padding: 8px; border-bottom: 1px solid #eee; }
        
        .correct { color: var(--success); font-weight: bold; }
        .wrong { color: var(--error); font-weight: bold; }
        .hidden { display: none !important; }

        /* Animación de feedback */
        .feedback-pop { animation: pop 0.4s ease-out; }
        @keyframes pop {
            0% { transform: scale(0.8); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
    </style>
</head>
<body>

    <div class="game-container">
        <h1>Yachay Yupaykunata</h1>

        <div id="setup-screen">
            <div>
                <label><strong>Participantes (uno por línea):</strong></label>
                <textarea id="players-list" placeholder="Ejemplo:&#10;Juan Perez&#10;Maria Lopez"></textarea>
            </div>
            <div>
                <label><strong>Preguntas por participante (Cualquier número positivo):</strong></label>
                <input type="number" id="q-per-player" value="5" min="1">
            </div>
            <button class="btn primary" style="width:100%; padding: 15px;" onclick="initMultiplayerGame()">Comenzar Desafío</button>
        </div>

        <div id="game-screen" class="hidden" style="text-align: center;">
            <div id="turn-indicator">Turno de: <span id="current-player-name"></span></div>
            <p id="progress-text">Pregunta 1 de X</p>
            
            <h2 id="target-number" style="font-size: 3.5rem; color: var(--accent); margin: 10px 0;"></h2>
            
            <div id="drop-zone" class="quechua-phrase"></div>
            <div id="options-container"></div>

            <div id="feedback" style="height: 40px; font-size: 1.5rem; font-weight: bold; margin: 15px;"></div>

            <div style="display: flex; justify-content: center;">
                <button id="check-btn" class="btn primary" onclick="checkStep()">Verificar Respuesta</button>
            </div>
        </div>
    </div>

    <div id="results-modal">
        <div class="modal-content">
            <h2 style="text-align: center;">Resultados Finales del Desafío</h2>
            
            <h3 style="border-left: 5px solid var(--accent); padding-left: 10px;">Resumen de Aciertos</h3>
            <div id="general-summary" class="summary-box"></div>

            <h3 style="margin-top: 30px; border-left: 5px solid var(--player-card); padding-left: 10px;">Historial Detallado</h3>
            <div id="players-reports-container"></div>
            
            <div style="text-align: center; margin-top: 20px;">
                <button class="btn primary" onclick="location.reload()">Reiniciar Todo</button>
            </div>
        </div>
    </div>
<footer>
        Msc. Bladimir Arias Mejia 2026
    </footer>

        const DB = DB_RAW.split('\n').map(l => {
            const p = l.split(' = ');
            return p.length === 2 ? { n: p[0], q: p[1].split(' ') } : null;
        }).filter(x => x);

        let players = [];
        let currentPlayerIdx = 0;
        let questionsPerPlayer = 0;
        let globalQuestions = [];
        let currentGlobalIdx = 0;
        let draggedElement = null;

        function initMultiplayerGame() {
            const list = document.getElementById('players-list').value.trim().split('\n').filter(n => n.trim() !== "");
            const qCount = parseInt(document.getElementById('q-per-player').value);

            if (list.length === 0) return alert("Ingresa al menos un participante.");
            if (isNaN(qCount) || qCount < 1) return alert("Ingresa un número válido de preguntas.");

            questionsPerPlayer = qCount;
            players = list.map(name => ({ name: name.trim(), score: 0, history: [], totalAsked: 0 }));

            // Generar pool de preguntas
            const totalNeeded = players.length * questionsPerPlayer;
            globalQuestions = [];
            for(let i=0; i<totalNeeded; i++) {
                globalQuestions.push(DB[Math.floor(Math.random()*DB.length)]);
            }

            document.getElementById('setup-screen').classList.add('hidden');
            document.getElementById('game-screen').classList.remove('hidden');
            loadStep();
        }

        function loadStep() {
            const player = players[currentPlayerIdx];
            const question = globalQuestions[currentGlobalIdx];

            document.getElementById('current-player-name').textContent = player.name;
            document.getElementById('progress-text').textContent = `Pregunta ${player.totalAsked + 1} de ${questionsPerPlayer}`;
            document.getElementById('target-number').textContent = question.n;
            document.getElementById('feedback').textContent = "";
            document.getElementById('check-btn').disabled = false;
            document.getElementById('check-btn').style.opacity = "1";

            const dz = document.getElementById('drop-zone'); dz.innerHTML = "";
            question.q.forEach(() => {
                const b = document.createElement('div');
                b.className = 'blank';
                initDropHandlers(b);
                dz.appendChild(b);
            });

            const optContainer = document.getElementById('options-container'); optContainer.innerHTML = "";
            let words = [...question.q];
            // Añadir distractores
            for(let i=0; i<2; i++) {
                const r = DB[Math.floor(Math.random()*DB.length)].q;
                const w = r[Math.floor(Math.random()*r.length)];
                if(!words.includes(w)) words.push(w);
            }

            words.sort(() => 0.5 - Math.random()).forEach(w => {
                const o = document.createElement('div');
                o.className = 'option'; o.textContent = w; o.draggable = true;
                o.addEventListener('dragstart', (e) => { draggedElement = o; e.dataTransfer.setData('text/plain', w); });
                optContainer.appendChild(o);
            });
        }

        function initDropHandlers(el) {
            el.addEventListener('dragover', (e) => { e.preventDefault(); el.classList.add('over'); });
            el.addEventListener('dragleave', () => el.classList.remove('over'));
            el.addEventListener('drop', (e) => {
                e.preventDefault(); el.classList.remove('over');
                const data = e.dataTransfer.getData('text/plain');

                if (el.textContent !== "") {
                    if (draggedElement.classList.contains('blank')) {
                        const tmp = el.textContent; el.textContent = draggedElement.textContent; draggedElement.textContent = tmp;
                    } else {
                        const oldText = el.textContent; el.textContent = data;
                        const backOpt = document.createElement('div');
                        backOpt.className = 'option'; backOpt.textContent = oldText; backOpt.draggable = true;
                        backOpt.addEventListener('dragstart', (e) => { draggedElement = backOpt; e.dataTransfer.setData('text/plain', oldText); });
                        document.getElementById('options-container').appendChild(backOpt);
                        draggedElement.remove();
                    }
                } else {
                    el.textContent = data;
                    if (!draggedElement.classList.contains('blank')) draggedElement.remove();
                    else draggedElement.textContent = "";
                }
                el.draggable = (el.textContent !== "");
                if(el.draggable) el.addEventListener('dragstart', (e) => { draggedElement = el; e.dataTransfer.setData('text/plain', el.textContent); });
            });
        }

        function checkStep() {
            const player = players[currentPlayerIdx];
            const question = globalQuestions[currentGlobalIdx];
            const userStr = Array.from(document.querySelectorAll('.blank')).map(b => b.textContent.trim()).join(' ');
            const correctStr = question.q.join(' ');
            const isCorrect = (userStr === correctStr);

            const feedback = document.getElementById('feedback');
            feedback.classList.remove('feedback-pop');
            void feedback.offsetWidth; // Trigger reflow
            feedback.classList.add('feedback-pop');

            if(isCorrect) {
                player.score++;
                feedback.textContent = "¡ALLIN! ✓";
                feedback.style.color = "var(--success)";
            } else {
                feedback.textContent = "MANA ALLINCHU ✗";
                feedback.style.color = "var(--error)";
            }

            player.history.push({ n: question.n, user: userStr || "(vacío)", correct: correctStr, ok: isCorrect });
            player.totalAsked++;
            document.getElementById('check-btn').disabled = true;
            document.getElementById('check-btn').style.opacity = "0.5";

            // ESPERA DE 1.6 SEGUNDOS Y CAMBIO AUTOMÁTICO
            setTimeout(() => {
                currentGlobalIdx++;
                if (currentGlobalIdx >= globalQuestions.length) {
                    showFinalMatrix();
                } else {
                    currentPlayerIdx = (currentPlayerIdx + 1) % players.length;
                    loadStep();
                }
            }, 1600);
        }

        function showFinalMatrix() {
            const summaryContainer = document.getElementById('general-summary');
            const reportsContainer = document.getElementById('players-reports-container');
            summaryContainer.innerHTML = "";
            reportsContainer.innerHTML = "";

            players.forEach(p => {
                const pct = Math.round((p.score / questionsPerPlayer) * 100);
                
                // 1. Resumen al principio (Tarjetas)
                const sItem = document.createElement('div');
                sItem.className = 'summary-item';
                sItem.innerHTML = `<strong>${p.name}</strong><br><span style="font-size:1.4rem; color:var(--accent)">${pct}%</span>`;
                summaryContainer.appendChild(sItem);

                // 2. Reportes detallados abajo
                const div = document.createElement('div');
                div.style.marginBottom = "20px";
                div.innerHTML = `
                    <h4 style="margin-bottom:5px;">Historial de ${p.name}</h4>
                    <table class="history-table">
                        <thead><tr><th>Nº</th><th>Respuesta</th><th>Estado</th></tr></thead>
                        <tbody>
                            ${p.history.map(h => `
                                <tr>
                                    <td>${h.n}</td>
                                    <td>${h.user}</td>
                                    <td class="${h.ok ? 'correct' : 'wrong'}">${h.ok ? '✓' : '✗ Solución: ' + h.correct}</td>
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>
                `;
                reportsContainer.appendChild(div);
            });

            document.getElementById('results-modal').style.display = 'block';
        }
    </script>
    
</body>
</html>
